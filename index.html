<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SmartMemo</title>
  <meta name="theme-color" content="#D4622A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SmartMemo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- 相対パスにすることで base (/SmartMemo/) 配下でも解決できる -->
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script>
    // 前回表示していたメモモンのスプライトを、JS バンドルの読み込みを待たずに取りに行く。
    // 覚えているのは App 側（preloadMonSprites）。失敗しても表示が少し遅れるだけ。
    try {
      JSON.parse(localStorage.getItem('smartmemoBoot:monSprites') || '[]').forEach(function (u) {
        if (typeof u === 'string' && u.indexOf('./sprites/') === 0) { var i = new Image(); i.src = u; }
      });
    } catch (e) {}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

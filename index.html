<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SmartMemo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#D4622A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SmartMemo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      height:100%; height:100dvh; width:100%; background:#fafaf9;
      font-family:'Inter',-apple-system,sans-serif;
      overscroll-behavior:none;
      -webkit-font-smoothing:antialiased;
      overflow:hidden;
    }
    #root { width:100%; height:100%; display:flex; justify-content:center; background:#e8e8e6; }

    /* Mobile / installed PWA — safe-area inserts */
    @media (max-width:500px), (display-mode:standalone) {
      .app-header   { padding-top:calc(14px + env(safe-area-inset-top)); }
      .bottom-nav { padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
      .bottom-nav-wrapper { /* safe area is handled by .bottom-nav padding */ }
      .toast        { top:calc(20px + env(safe-area-inset-top)); }
      .modal-sheet, .confirm-sheet { padding-bottom:calc(32px + env(safe-area-inset-bottom)); }
      /* Prevent iOS auto-zoom on focus: form inputs must be ≥16px */
      .memo-textarea, .modal-field input, .modal-field select {
        font-size:max(16px, var(--fs-base));
      }
    }
    button { -webkit-appearance:none; appearance:none; }

    /* CSS Variables (theme) — applied to root .app which fills the viewport */
    .app {
      --accent:       #D4622A;
      --accent-light: rgba(212,98,42,0.10);
      --accent-text:  #fff;
      --fs-base:      14px;
      --fs-sm:        12px;
      --fs-xs:        11px;
      --fs-lg:        16px;

      width:100%; height:100%;
      display:flex; flex-direction:column;
      background:#fafaf9; color:#1a1a18;
      overflow:hidden; position:relative;
      font-size:var(--fs-base);
    }

    /* Header */
    .app-header {
      padding:14px 20px 12px;
      background:#fafaf9; border-bottom:1px solid #ebebea;
      display:flex; align-items:center; justify-content:space-between;
      flex:0 0 auto;
      min-height:50px;
    }
    .header-left { display:flex; align-items:baseline; gap:8px; }
    .app-header h1 { font-size:18px; font-weight:700; letter-spacing:-0.6px; color:#1a1a18; }
    .app-header .tagline { font-size:var(--fs-xs); color:#a0a09c; }
    .coin-badge {
      display:flex; align-items:center; gap:5px;
      background:var(--accent-light); border-radius:20px;
      padding:5px 10px 5px 8px; border:none; cursor:pointer;
      flex-shrink:0; transition:opacity .15s;
    }
    .coin-badge:active { opacity:.75; }
    .coin-badge-count { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:-.2px; }
    .coin-badge-gacha { font-size:10px; font-weight:700; color:var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:1px 5px; letter-spacing:.2px; }

    /* Gacha modal */
    .gacha-backdrop { align-items:center; justify-content:center; }
    .gacha-modal {
      background:#fff; border:1px solid #ebebea; border-radius:20px;
      padding:24px 20px 28px; width:calc(100% - 32px); max-width:360px;
      min-height:430px;
      position:relative; display:flex; flex-direction:column; align-items:center; gap:14px;
      box-shadow:0 8px 40px rgba(0,0,0,.16);
    }
    .gacha-close-btn {
      position:absolute; top:12px; right:12px;
      background:#f5f5f3; border:none; width:28px; height:28px; border-radius:50%;
      font-size:13px; color:#8a8a88; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:background .12s;
    }
    .gacha-close-btn:hover { background:#ebebea; }
    .gacha-title {
      font-size:20px; font-weight:800; letter-spacing:1px; color:#1a1a18;
    }
    .gacha-cost-info { display:flex; align-items:center; gap:4px; font-size:13px; color:#a0a09c; }
    .gacha-capsule {
      width:120px; height:120px; border-radius:50%;
      background:var(--accent);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 20px rgba(212,98,42,.35);
      position:relative; overflow:hidden;
    }
    .gacha-capsule.spinning { animation:gacha-spin 1.5s ease-in-out forwards; }
    .gacha-capsule.revealed { animation:gacha-reveal .55s cubic-bezier(.17,.67,.34,1.4) forwards; }
    @keyframes gacha-spin {
      0%   { transform:rotate(0deg)   scale(1);    filter:brightness(1); }
      15%  { transform:rotate(180deg) scale(1.22); filter:brightness(1.4); }
      35%  { transform:rotate(450deg) scale(.82);  filter:brightness(.8); }
      55%  { transform:rotate(630deg) scale(1.18); filter:brightness(1.6); }
      78%  { transform:rotate(705deg) scale(.93);  filter:brightness(1.2); }
      100% { transform:rotate(720deg) scale(1);    filter:brightness(1); }
    }
    @keyframes gacha-reveal {
      0%   { transform:scale(.15) rotate(-140deg); opacity:0; filter:brightness(3); }
      55%  { transform:scale(1.22) rotate(8deg);   opacity:1; }
      78%  { transform:scale(.95) rotate(-3deg); }
      100% { transform:scale(1) rotate(0deg);       filter:brightness(1); }
    }
    .gacha-flash {
      position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.85) 0%, rgba(255,200,140,.4) 50%, transparent 80%);
      animation:gacha-flash-anim 1.5s ease-out forwards; pointer-events:none;
    }
    @keyframes gacha-flash-anim {
      0%   { opacity:0; transform:scale(.4); }
      18%  { opacity:1; transform:scale(1.1); }
      55%  { opacity:.5; }
      100% { opacity:0; transform:scale(1.3); }
    }
    .gacha-capsule-inner {
      width:50px; height:50px; border-radius:50%;
      background:rgba(255,255,255,.4); box-shadow:inset 0 2px 8px rgba(0,0,0,.1);
      display:flex; align-items:center; justify-content:center;
      font-size:22px; font-weight:900; color:#fff;
    }
    .gacha-result-area {
      min-height:80px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:6px; width:100%;
    }
    .gacha-result { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .gacha-result-rarity { font-size:16px; letter-spacing:4px; animation:star-glow-anim 1.2s ease-in-out infinite alternate; }
    @keyframes star-glow-anim {
      from { text-shadow:0 0 4px currentColor; opacity:.85; }
      to   { text-shadow:0 0 14px currentColor, 0 0 28px currentColor; opacity:1; }
    }
    .gacha-result-label { font-size:26px; line-height:1; }
    .gacha-result-name { font-size:15px; font-weight:700; text-align:center; color:#1a1a18; }
    .gacha-result-desc { font-size:12px; color:#6a6a68; text-align:center; background:#f5f5f3; border-radius:8px; padding:5px 14px; width:100%; }
    .gacha-coin-display { display:flex; align-items:center; gap:4px; font-size:13px; color:#a0a09c; }
    .gacha-pull-btn {
      width:100%; padding:13px 24px; border:none; border-radius:12px;
      background:var(--accent); color:var(--accent-text);
      font-size:var(--fs-base); font-weight:700; cursor:pointer; font-family:inherit;
      transition:opacity .15s, transform .1s;
    }
    .gacha-pull-btn:not(:disabled):hover { opacity:.88; }
    .gacha-pull-btn:not(:disabled):active { transform:scale(.97); }
    .gacha-pull-btn:disabled { opacity:.35; cursor:not-allowed; }

    /* Tab content */
    .tab-content {
      flex:1; min-height:0;
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    .tab-pane {
      flex:1; min-height:0;
      overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
    }
    .tab-pane::-webkit-scrollbar { display:none; }
    .tab-pane > * { flex-shrink:0; }

    /* Bottom nav */
    .bottom-nav-wrapper {
      position:relative; flex:0 0 auto;
      isolation:isolate;
    }
    .bottom-nav {
      display:flex; background:#fff;
      box-shadow:0 -2px 14px rgba(0,0,0,.09);
      border-radius:20px 20px 0 0;
      padding:4px 0 6px;
      align-items:flex-end;
      width:100%;
    }
    .nav-tab {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-end;
      gap:3px; cursor:pointer; padding-bottom:5px; min-height:54px;
    }
    .nav-mic-slot {
      width:72px; flex-shrink:0; /* empty placeholder aligned with mic button */
    }
    .nav-center-mic {
      position:absolute;
      left:50%; transform:translateX(-50%);
      bottom:calc(100% - 46px);
      width:62px; height:62px; border-radius:50%; border:none;
      background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 16px rgba(0,0,0,.26);
      cursor:pointer;
      transition:transform .15s, box-shadow .15s;
    }
    .nav-center-mic:active { transform:translateX(-50%) scale(.91); box-shadow:0 2px 8px rgba(0,0,0,.14); }
    /* Copy button for TODO/Idea items */
    .item-copy-btn {
      width:24px; height:24px; border:1px solid #ebebea; background:#fff;
      border-radius:6px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; color:#b0b0ba;
      flex-shrink:0; transition:background .12s, color .12s;
    }
    .item-copy-btn:hover { background:#f0f5ff; color:#2e7bef; border-color:#cce0ff; }
    .nav-tab .nav-icon svg { transition:all 0.2s; width:24px; height:24px; }
    .nav-tab .nav-label { font-size:11px; font-weight:500; color:#c0c0ba; letter-spacing:0.2px; transition:color 0.2s; }
    .nav-tab.active .nav-label { color:var(--accent); }
    .nav-tab.pulse { animation: nav-pulse .9s ease-out 1; }
    @keyframes nav-pulse {
      0%   { transform:scale(1); }
      35%  { transform:scale(1.18); }
      70%  { transform:scale(.96); }
      100% { transform:scale(1); }
    }

    /* Loading overlay */
    .loading-overlay {
      position:absolute; inset:0;
      background:rgba(250,250,249,0.92); backdrop-filter:blur(6px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      z-index:100;
    }
    .spinner {
      width:30px; height:30px;
      border:2px solid #e0e0de; border-top-color:var(--accent);
      border-radius:50%; animation:spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-text { font-size:var(--fs-base); font-weight:500; color:#1a1a18; }
    .loading-sub  { font-size:var(--fs-sm); color:#a0a09c; }

    /* Toast */
    .toast {
      position:absolute; top:64px; left:16px; right:16px;
      background:#1a1a18; color:#fafaf9; border-radius:10px;
      padding:11px 14px; font-size:var(--fs-sm); font-weight:500;
      z-index:200; animation:toastIn .25s ease, toastOut .25s 2.3s ease forwards;
    }
    @keyframes toastIn  { from{transform:translateY(-8px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes toastOut { to{opacity:0} }

    /* Tag pill */
    .tag-pill {
      display:inline-flex; align-items:center;
      padding:2px 7px; border-radius:4px;
      font-size:10px; font-weight:600; letter-spacing:0.2px;
      background:var(--accent-light); color:var(--accent);
    }

    /* MEMO TAB */
    .memo-tab { padding:18px 16px; display:flex; flex-direction:column; gap:12px; }
    .memo-card { background:#fff; border:1px solid #ebebea; border-radius:12px; overflow:hidden; }
    .memo-card-top {
      padding:12px 14px 0;
      display:flex; align-items:center; justify-content:space-between;
    }
    .memo-card-label { font-size:var(--fs-xs); font-weight:600; color:#a0a09c; letter-spacing:0.6px; text-transform:uppercase; }
    .memo-char-count { font-size:var(--fs-xs); color:#c0c0ba; }
    .memo-textarea {
      width:100%; padding:10px 14px 12px;
      border:none; outline:none; resize:none; min-height:148px;
      font-size:var(--fs-base); font-weight:400; line-height:1.65;
      color:#1a1a18; background:transparent; font-family:inherit;
    }
    .memo-textarea::placeholder { color:#c8c8c4; }
    .memo-actions {
      padding:8px 12px 10px; border-top:1px solid #f0f0ee; display:flex; gap:6px;
    }
    .action-btn {
      display:flex; align-items:center; gap:5px;
      padding:6px 11px; border-radius:7px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-xs); font-weight:500;
      color:#4a4a48; font-family:inherit; transition:background .12s;
    }
    .action-btn:hover { background:#f5f5f3; }
    .action-btn.recording { background:#1a1a18; border-color:#1a1a18; color:#fff; }
    .pulse-dot {
      width:8px; height:8px; border-radius:50%;
      background:#fff; display:inline-block;
      animation: rec-pulse 1s ease-in-out infinite;
    }
    @keyframes rec-pulse {
      0%, 100% { opacity:1; transform:scale(1); }
      50%      { opacity:.45; transform:scale(.78); }
    }

    .img-preview { position:relative; border-radius:10px; overflow:hidden; border:1px solid #ebebea; }
    .img-preview img { width:100%; max-height:130px; object-fit:cover; display:block; }
    .img-clear {
      position:absolute; top:6px; right:6px; width:22px; height:22px;
      border-radius:50%; background:rgba(0,0,0,.45); border:none; color:#fff;
      font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }

    .reflect-btn {
      width:100%; padding:15px; border:none; border-radius:12px;
      background:var(--accent); color:var(--accent-text);
      font-size:var(--fs-base); font-weight:600; letter-spacing:-0.2px;
      cursor:pointer; font-family:inherit;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:opacity .15s, transform .1s;
      position:relative; overflow:hidden;
    }
    .reflect-btn:hover   { opacity:.88; }
    .reflect-btn:active  { transform:scale(.98); }
    .reflect-btn:disabled { opacity:.4; cursor:not-allowed; }
    /* AI shine sweep on hover */
    .reflect-btn::after {
      content:''; position:absolute; top:0; bottom:0; left:-40%; width:35%;
      background:linear-gradient(110deg, transparent 0%, rgba(255,255,255,.28) 50%, transparent 100%);
      transform:skewX(-16deg);
      transition:left .65s ease;
      pointer-events:none;
    }
    .reflect-btn:hover::after { left:120%; }

    .hint-card { background:#fff; border:1px solid #ebebea; border-radius:12px; padding:12px 14px; }
    .hint-title { font-size:var(--fs-xs); font-weight:600; color:#4a4a48; margin-bottom:6px; }
    .hint-body  { font-size:var(--fs-xs); color:#a0a09c; line-height:1.8; }

    /* TODO TAB */
    .todo-tab {
      display:flex; flex-direction:column;
      flex:1; min-height:0;
      overflow:hidden;
    }
    .todo-pane-left { flex-shrink:0; width:100%; min-width:0; overflow-x:hidden; }
    .todo-pane-right { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    @media (min-width:760px) {
      .todo-tab { flex-direction:row; }
      .todo-pane-left {
        flex:0 0 min(380px, 42%); width:auto; display:flex; flex-direction:column;
        border-right:1px solid #ebebea; overflow-y:auto; overflow-x:hidden;
      }
      .todo-pane-left .calendar-section,
      .todo-pane-left .calendar-section.hide {
        max-height:none; flex:1; overflow:auto; border-bottom:none;
      }
      .todo-pane-left .todo-list-header { border-bottom:none; }
      .cal-toggle { display:none; }
    }

    .todo-controls {
      padding:12px 16px; background:#fff; border-bottom:1px solid #ebebea;
      flex-shrink:0;
    }
    .search-box {
      margin-bottom:8px;
    }
    .search-input {
      width:100%; padding:9px 12px; border:1px solid #e0e0de;
      border-radius:8px; font-size:var(--fs-base); font-family:inherit;
      outline:none; color:#1a1a18; background:#fafaf9;
    }
    .search-input:focus { border-color:var(--accent); background:#fff; }
    .filter-tags {
      display:flex; gap:6px; flex-wrap:wrap;
    }
    .filter-tag {
      padding:6px 11px; border-radius:6px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-xs);
      font-weight:500; color:#4a4a48; transition:all .12s; font-family:inherit;
    }
    .filter-tag:hover { background:#f5f5f3; }
    .filter-tag.active { background:var(--accent); border-color:var(--accent); color:#fff; }

    .calendar-section {
      background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0;
      overflow:hidden;
      max-height:520px;
      transition:max-height .38s cubic-bezier(.4,0,.2,1);
    }
    .calendar-section.hide {
      max-height:0;
      border-bottom-color:transparent;
    }

    .cal-wrapper { background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0; overflow:hidden; width:100%; }
    .cal-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px 6px;
    }
    .cal-month-label { font-size:var(--fs-base); font-weight:700; letter-spacing:-.3px; }
    .cal-nav { display:flex; gap:2px; }
    .cal-nav-btn {
      width:26px; height:26px; border:1px solid #e0e0de; background:#fff;
      border-radius:6px; cursor:pointer; font-size:13px; color:#4a4a48;
      display:flex; align-items:center; justify-content:center; transition:background .12s;
    }
    .cal-nav-btn:hover { background:#f5f5f3; }
    .cal-dow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); padding:0 10px; }
    .cal-dow-cell { text-align:center; font-size:10px; font-weight:600; color:#b0b0ac; padding:3px 0; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); padding:2px 10px 10px; gap:1px; }
    .cal-grid.cal-slide-prev { animation: cal-slide-out-left .2s ease forwards; }
    .cal-grid.cal-slide-next { animation: cal-slide-out-right .2s ease forwards; }
    @keyframes cal-slide-out-left {
      from { transform:translateX(0); opacity:1; }
      to { transform:translateX(-100%); opacity:0; }
    }
    @keyframes cal-slide-out-right {
      from { transform:translateX(0); opacity:1; }
      to { transform:translateX(100%); opacity:0; }
    }
    @keyframes cal-slide-in-left {
      from { transform:translateX(100%); opacity:0; }
      to { transform:translateX(0); opacity:1; }
    }
    @keyframes cal-slide-in-right {
      from { transform:translateX(-100%); opacity:0; }
      to { transform:translateX(0); opacity:1; }
    }
    .cal-cell {
      aspect-ratio:1; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-start; padding-top:2px;
      cursor:pointer; border-radius:7px; transition:background .1s; position:relative;
      overflow:visible; min-width:0;
    }
    .cal-cell:hover { background:#f5f5f3; }
    .cal-num { font-size:13px; font-weight:400; color:#1a1a18; line-height:1; flex-shrink:0; position:relative; z-index:2; }
    .cal-cell.other-month .cal-num { color:#d0d0cc; }
    .cal-cell.today { background:#f0f0ee; }
    .cal-cell.today .cal-num { font-weight:700; }
    .cal-cell.selected { background:var(--accent) !important; }
    .cal-cell.selected .cal-num { color:#fff !important; font-weight:600; }
    .cal-dot {
      position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
      width:3px; height:3px; border-radius:50%; background:var(--accent);
    }
    .cal-cell.selected .cal-dot { background:rgba(255,255,255,.5); }
    .cal-todos {
      width:100%; font-size:8px; line-height:1;
      display:flex; flex-direction:column; gap:1px; margin-top:2px;
      flex:1; min-height:0; justify-content:flex-start;
    }
    .cal-todo-item {
      width:100%; background:var(--accent-light); color:var(--accent);
      height:13px; line-height:13px; padding:0 3px;
      border-radius:2px; white-space:nowrap; overflow:hidden;
      text-overflow:ellipsis; font-weight:500; letter-spacing:0; font-size:8px;
    }
    .cal-cell.selected .cal-todo-item {
      background:rgba(255,255,255,.3); color:#fff;
    }
    /* Multi-day spanning bars — same height as single-day items */
    .cal-todo-item.span-start {
      border-radius:3px 0 0 3px;
      width:calc(100% + 3px); padding-right:0;
    }
    .cal-todo-item.span-middle {
      border-radius:0;
      width:calc(100% + 6px); margin-left:-3px;
      padding:0; font-size:0; /* height:13px keeps bar same height via explicit rule */
    }
    .cal-todo-item.span-end {
      border-radius:0 3px 3px 0;
      width:calc(100% + 3px); margin-left:-3px;
      padding:0; font-size:0;
    }
    .cal-more {
      width:100%; font-size:6px; color:var(--accent);
      text-align:center; padding:0.5px 0; font-weight:700;
    }
    .cal-cell.selected .cal-more { color:#fff; }

    .todo-list-area {
      padding:16px;
      flex:1; min-height:0;
      overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
    }
    .todo-list-header {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 16px; flex-shrink:0; gap:8px;
      background:#fff; border-bottom:1px solid #f0f0ee;
    }
    .calendar-mode-toggle {
      display:flex; gap:4px;
    }
    .mode-btn {
      padding:6px 10px; border-radius:6px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-sm); font-weight:500;
      color:#4a4a48; transition:all .12s; font-family:inherit;
    }
    .mode-btn:hover { background:#f5f5f3; }
    .mode-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

    .cal-toggle {
      display:flex; align-items:center; justify-content:center; gap:4px;
      padding:6px 10px; border-radius:8px; border:1px solid #ebebea;
      background:#fff; cursor:pointer; color:#4a4a48;
      transition:background .12s; flex-shrink:0;
    }
    .cal-toggle:hover { background:#f5f5f3; }
    .todo-list-area::-webkit-scrollbar { display:none; }
    .section-head { display:flex; align-items:center; gap:7px; margin-bottom:10px; }
    .section-head-label { font-size:var(--fs-xs); font-weight:600; color:#a0a09c; text-transform:uppercase; letter-spacing:.5px; }
    .section-count { font-size:10px; font-weight:700; background:var(--accent); color:#fff; border-radius:10px; padding:1px 7px; }
    .todo-empty { text-align:center; padding:28px 0 10px; color:#c0c0ba; font-size:var(--fs-sm); }
    .divider { height:1px; background:#ebebea; margin:14px 0; }
    .overdue-head { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
    .overdue-head .section-head-label { color:#c0392b !important; }
    .overdue-head .section-count { background:#c0392b !important; }
    .todo-item.overdue { border-color:#f8d0cb; background:#fff8f7; }
    .todo-item.overdue .todo-title { color:#c0392b; }
    .todo-item.overdue .todo-date-str { color:#c0392b; }
    .undated-head { cursor:pointer; user-select:none; }
    .undated-head:active { opacity:.7; }
    .undated-arrow { margin-left:auto; font-size:11px; color:#a0a09c; }
    .undated-body { overflow:hidden; max-height:2000px; transition:max-height .35s cubic-bezier(.4,0,.2,1); }
    .undated-body.closed { max-height:0; }

    /* Todo item */
    .todo-item {
      background:#fff; border:1px solid #ebebea; border-radius:10px;
      padding:11px 12px; margin-bottom:7px;
      display:flex; align-items:flex-start; gap:10px; transition:opacity .2s;
    }
    .todo-item.done { opacity:.45; }
    .todo-check {
      width:18px; height:18px; border-radius:50%; border:1.5px solid #c0c0ba;
      flex-shrink:0; margin-top:2px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .15s; background:#fff;
    }
    .todo-check.checked { background:var(--accent); border-color:var(--accent); }
    .todo-check.animate-pop { animation: complete-pop .42s cubic-bezier(.34,1.56,.64,1); }
    @keyframes complete-pop {
      0%   { transform:scale(1); box-shadow:0 0 0 0 var(--accent-light); }
      40%  { transform:scale(1.45); box-shadow:0 0 0 10px var(--accent-light); }
      100% { transform:scale(1); box-shadow:0 0 0 0 rgba(0,0,0,0); }
    }
    .todo-item.animate-fade { animation: complete-fade .55s ease; }
    @keyframes complete-fade {
      0%   { background:var(--accent-light); }
      100% { background:#fff; }
    }
    /* Item entrance — used after memo→TODO/idea reflection */
    .todo-item.just-added,
    .idea-card.just-added {
      animation: item-arrive .55s cubic-bezier(.32,.72,.32,1) both;
      box-shadow: 0 0 0 0 var(--accent-light);
    }
    @keyframes item-arrive {
      0%   { opacity:0; transform:translateY(-14px) scale(.96); box-shadow:0 0 0 0 var(--accent-light); }
      45%  { opacity:1; transform:translateY(2px)   scale(1.01); box-shadow:0 0 0 6px var(--accent-light); }
      100% { opacity:1; transform:translateY(0)     scale(1);    box-shadow:0 0 0 0 rgba(0,0,0,0); }
    }
    .todo-body { flex:1; min-width:0; cursor:pointer; }
    .todo-title { font-size:var(--fs-base); font-weight:500; color:#1a1a18; line-height:1.45; }
    .todo-item.done .todo-title { text-decoration:line-through; }
    .todo-meta { display:flex; align-items:center; gap:5px; margin-top:5px; flex-wrap:wrap; }
    .todo-date-str { font-size:10px; color:#b0b0ac; display:flex; align-items:center; gap:3px; }
    .todo-del {
      width:24px; height:24px; border:1px solid #ebebea; background:#fff;
      border-radius:6px; cursor:pointer; font-size:11px;
      display:flex; align-items:center; justify-content:center; color:#c0c0ba;
      flex-shrink:0; transition:background .12s, color .12s;
    }
    .todo-del:hover { background:#fdf0f0; color:#c0392b; border-color:#f0d0d0; }

    /* Edit Modal */
    .modal-backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      display:flex; align-items:flex-end; z-index:1000;
      animation:bdIn .2s ease;
    }
    @keyframes bdIn { from{opacity:0} to{opacity:1} }
    .modal-sheet {
      background:#fafaf9; border-radius:18px 18px 0 0;
      width:100%; padding:20px 18px 32px;
      animation:sheetUp .25s ease;
    }
    @keyframes sheetUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-handle { width:36px; height:4px; border-radius:2px; background:#d0d0cc; margin:0 auto 18px; }
    .modal-title { font-size:15px; font-weight:700; margin-bottom:16px; letter-spacing:-.3px; }
    .modal-field { margin-bottom:12px; }
    .modal-field label { display:block; font-size:var(--fs-xs); font-weight:600; color:#a0a09c; text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
    .modal-field input, .modal-field select {
      width:100%; padding:9px 11px; border:1px solid #e0e0de; border-radius:8px;
      font-size:var(--fs-base); color:#1a1a18; background:#fff; font-family:inherit; outline:none;
    }
    .modal-field input:focus, .modal-field select:focus { border-color:var(--accent); }
    .modal-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .modal-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .modal-tag {
      padding:5px 10px; border-radius:6px; border:1px solid #e0e0de;
      font-size:var(--fs-xs); font-weight:500; cursor:pointer; background:#fff; color:#4a4a48;
      transition:all .12s;
    }
    .modal-tag.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
    .modal-actions { display:flex; gap:8px; margin-top:18px; }
    .modal-cancel {
      flex:1; padding:12px; border:1px solid #e0e0de; border-radius:10px;
      background:#fff; font-size:var(--fs-base); font-weight:500; cursor:pointer; font-family:inherit;
    }
    .modal-save {
      flex:2; padding:12px; border:none; border-radius:10px;
      background:var(--accent); color:#fff;
      font-size:var(--fs-base); font-weight:600; cursor:pointer; font-family:inherit;
    }

    /* Confirm Sheet */
    .confirm-sheet {
      background:#fafaf9; border-radius:18px 18px 0 0;
      width:100%; max-height:88%; padding:20px 18px 96px;
      display:flex; flex-direction:column;
      animation:sheetUp .25s ease;
    }
    .confirm-sheet.swooshing { animation: sheet-swoosh .35s ease forwards; }
    @keyframes sheet-swoosh {
      to { transform:translateY(120%); opacity:0; }
    }
    .confirm-header { margin-bottom:12px; }
    .confirm-title { font-size:15px; font-weight:700; letter-spacing:-.3px; margin-bottom:4px; }
    .confirm-sub   { font-size:var(--fs-xs); color:#a0a09c; line-height:1.55; }
    .confirm-list  { flex:1; overflow-y:auto; min-height:60px; padding:2px 0 6px; }
    .confirm-list::-webkit-scrollbar { display:none; }
    .confirm-actions {
      display:flex; gap:8px; margin-top:12px;
      border-top:1px solid #ebebea; padding-top:14px;
    }
    .modal-save:disabled { opacity:.4; cursor:not-allowed; }
    .confirm-section-head {
      font-size:var(--fs-xs); font-weight:600; color:#a0a09c;
      text-transform:uppercase; letter-spacing:.5px;
      margin:8px 2px 6px;
    }
    .confirm-section-head:first-child { margin-top:0; }
    .merge-indicator {
      display:inline-block; font-size:10px; color:var(--accent);
      font-weight:600; margin-top:3px; margin-right:6px;
    }
    .modal-field textarea {
      width:100%; padding:9px 11px; border:1px solid #e0e0de; border-radius:8px;
      font-size:var(--fs-base); color:#1a1a18; background:#fff; font-family:inherit;
      outline:none; resize:vertical; min-height:84px; line-height:1.55;
    }
    .modal-field textarea:focus { border-color:var(--accent); }

    /* IDEAS TAB */
    .ideas-tab { padding:16px; display:flex; flex-direction:column; gap:8px; }
    .idea-card {
      background:#fff; border:1px solid #ebebea; border-radius:10px;
      padding:13px 14px; cursor:pointer; transition:background .12s;
      display:flex; gap:10px; align-items:flex-start;
    }
    .idea-card:hover { background:#fafaf9; }
    .idea-card-body { flex:1; min-width:0; }
    .idea-project {
      font-size:var(--fs-base); font-weight:600; color:#1a1a18;
      letter-spacing:-.2px; line-height:1.35;
    }
    .idea-summary { font-size:var(--fs-sm); color:#4a4a48; line-height:1.55; margin-top:4px; }
    .idea-details { list-style:none; margin-top:8px; display:flex; flex-direction:column; gap:4px; }
    .idea-detail {
      font-size:var(--fs-xs); color:#4a4a48; padding-left:14px;
      position:relative; line-height:1.55;
    }
    .idea-detail::before {
      content:''; position:absolute; left:4px; top:7px;
      width:4px; height:4px; border-radius:50%; background:var(--accent);
    }
    .idea-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .idea-updated { font-size:10px; color:#b0b0ac; }
    .ideas-empty {
      text-align:center; padding:60px 20px; color:#a0a09c;
      font-size:var(--fs-sm); line-height:1.7;
    }
    .ideas-wrapper { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
    .ideas-header-row { display:flex; align-items:center; background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0; }
    .ideas-header-row .ideas-subtabs { border-bottom:none; flex:1; min-width:0; }
    /* Add-row buttons — natural inline placement */
    .todo-add-row {
      display:flex; align-items:center; gap:7px;
      width:100%; padding:12px 16px;
      background:transparent; border:none; border-top:1px solid #f0f0ee;
      color:var(--accent); font-size:var(--fs-base); font-weight:500;
      cursor:pointer; text-align:left; font-family:inherit; letter-spacing:.1px;
    }
    .todo-add-row:active { background:#f5f5f3; }
    .ideas-add-row {
      display:flex; align-items:center; justify-content:center; gap:6px;
      margin:12px 16px; padding:12px;
      background:var(--accent-light); color:var(--accent);
      border:none; border-radius:12px; width:calc(100% - 32px);
      font-size:var(--fs-base); font-weight:600; cursor:pointer;
      font-family:inherit; transition:opacity .15s; flex-shrink:0;
    }
    .ideas-add-row:active { opacity:.7; }
    .ideas-subtabs {
      display:flex; align-items:center; overflow-x:auto;
      padding:0 16px; border-bottom:1px solid #ebebea;
      background:#fff; flex-shrink:0;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .ideas-subtabs::-webkit-scrollbar { display:none; }
    .ideas-subtab {
      padding:10px 12px; font-size:var(--fs-sm); font-weight:500; color:#a0a09c;
      cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
      transition:color .15s, border-color .15s; flex-shrink:0;
      display:inline-flex; align-items:center; gap:4px;
    }
    .ideas-subtab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .ideas-subtab:hover:not(.active) { color:#4a4a48; }
    .ideas-subtab.dragging { opacity:.45; }
    .ideas-subtab.drag-over { background:var(--accent-light); border-radius:4px 4px 0 0; color:var(--accent); }
    .ideas-subtab.drop-target { background:var(--accent-light); border-radius:4px 4px 0 0; }
    .idea-card[draggable] { cursor:grab; }
    .idea-card.dragging { opacity:.35; cursor:grabbing; }
    .idea-card.touch-dragging { opacity:.35; transform:scale(.97); box-shadow:0 4px 20px rgba(0,0,0,.15); }
    .idea-card.drag-over-top { box-shadow:0 -3px 0 0 var(--accent), 0 1px 4px rgba(0,0,0,.06); }
    .idea-card.drag-over-bottom { box-shadow:0 3px 0 0 var(--accent), 0 1px 4px rgba(0,0,0,.06); }
    .ideas-tab.touch-dragging { touch-action:none; user-select:none; }
    .ideas-subtab-del {
      width:14px; height:14px; border-radius:50%; background:transparent;
      border:none; cursor:pointer; color:#c0c0ba; font-size:10px;
      padding:0; display:inline-flex; align-items:center; justify-content:center;
    }
    .ideas-subtab-del:hover { color:#c0392b; background:#fdf0f0; }
    .ideas-subtab-add {
      padding:10px 10px; font-size:18px; color:#c0c0ba;
      cursor:pointer; flex-shrink:0; transition:color .15s; line-height:1;
    }
    .ideas-subtab-add:hover { color:var(--accent); }
    .ideas-subtab-input {
      display:flex; align-items:center; gap:6px;
      padding:8px 16px; background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0;
    }
    .ideas-subtab-input input {
      flex:1; padding:6px 10px; border:1px solid #e0e0de; border-radius:7px;
      font-size:var(--fs-sm); color:#1a1a18; background:#fafaf9;
      font-family:inherit; outline:none;
    }
    .ideas-subtab-input input:focus { border-color:var(--accent); background:#fff; }
    .ideas-subtab-input button {
      padding:6px 12px; border:none; border-radius:7px;
      background:var(--accent); color:#fff; cursor:pointer;
      font-size:var(--fs-xs); font-weight:600; font-family:inherit;
    }
    .ideas-subtab-input button:disabled { opacity:.4; cursor:not-allowed; }
    .ideas-subtab-input .cancel-btn {
      background:#fff; color:#4a4a48; border:1px solid #e0e0de;
    }

    /* SETTINGS TAB */
    .settings-tab { padding:18px 16px; display:flex; flex-direction:column; gap:10px; }
    .settings-section-title {
      font-size:var(--fs-xs); font-weight:600; color:#a0a09c;
      text-transform:uppercase; letter-spacing:.6px;
      padding:0 2px; margin-bottom:2px;
    }
    .settings-card { background:#fff; border:1px solid #ebebea; border-radius:12px; overflow:hidden; }
    .settings-row {
      padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid #f0f0ee;
    }
    .settings-row:last-child { border-bottom:none; }
    .settings-row-label { font-size:var(--fs-base); font-weight:500; color:#1a1a18; }
    .settings-row-sub   { font-size:var(--fs-xs); color:#a0a09c; margin-top:1px; }

    /* Color swatches */
    .color-swatches { display:flex; gap:10px; }
    .color-swatch {
      width:28px; height:28px; border-radius:50%; cursor:pointer;
      border:2px solid transparent; transition:all .15s; position:relative;
    }
    .color-swatch.sel { border-color:#1a1a18; transform:scale(1.12); }
    .color-swatch.sel::after {
      content:''; position:absolute; inset:3px;
      border-radius:50%; border:1.5px solid rgba(255,255,255,.8);
    }

    /* Font size selector */
    .font-size-opts { display:flex; gap:6px; }
    .font-size-opt {
      padding:5px 12px; border-radius:7px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-family:inherit; color:#4a4a48;
      font-weight:500; transition:all .12s;
    }
    .font-size-opt.sel { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* Toggle */
    .toggle {
      width:44px; height:26px; border-radius:13px; border:none; cursor:pointer;
      position:relative; transition:background .2s;
    }
    .toggle::after {
      content:''; position:absolute; top:3px; left:3px;
      width:20px; height:20px; border-radius:50%; background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .2s;
    }
    .toggle.on { background:var(--accent); }
    .toggle.on::after { left:21px; }
    .toggle.off { background:#d0d0cc; }
    .sound-type-opts { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .sound-type-btn {
      padding:5px 10px; border-radius:6px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-xs); font-weight:500;
      color:#4a4a48; transition:all .12s; font-family:inherit;
    }
    .sound-type-btn:hover { background:#f5f5f3; }
    .sound-type-btn.sel { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* Gemini API key field */
    .api-row { padding:14px 16px; }
    .api-input-row { display:flex; gap:6px; margin-top:8px; }
    .api-input-row input {
      flex:1; padding:8px 11px; border:1px solid #e0e0de; border-radius:7px;
      font-size:var(--fs-sm); color:#1a1a18; background:#fff;
      font-family:inherit; outline:none;
      letter-spacing:.5px;
    }
    .api-input-row input:focus { border-color:var(--accent); }
    .api-input-row button {
      padding:8px 14px; border:none; border-radius:7px;
      background:var(--accent); color:#fff; cursor:pointer;
      font-size:var(--fs-sm); font-weight:600; font-family:inherit;
    }
    .api-input-row button.secondary {
      background:#fff; color:#4a4a48; border:1px solid #e0e0de;
    }
    .api-status {
      margin-top:8px; font-size:10px; font-weight:600;
      letter-spacing:.3px;
    }
    .api-status.ok   { color:#2A8C5A; }
    .api-status.ng   { color:#c0392b; }
    .api-status.idle { color:#a0a09c; }

    /* Tag customization */
    .tag-row { padding:14px 16px; border-bottom:1px solid #f0f0ee; }
    .tag-row:last-child { border-bottom:none; }
    .tag-row .settings-row-label { margin-bottom:8px; }
    .tag-chip-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tag-chip {
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 4px 4px 10px; border-radius:6px;
      background:var(--accent-light); color:var(--accent);
      font-size:var(--fs-xs); font-weight:600;
    }
    .tag-chip-builtin {
      background:#f0f0ee; color:#6a6a68;
      padding:4px 10px;
    }
    .tag-chip button {
      width:18px; height:18px; border:none; border-radius:50%;
      background:transparent; color:var(--accent); cursor:pointer;
      font-size:14px; line-height:1; padding:0;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .tag-chip button:hover { background:rgba(0,0,0,.08); }
    .tag-add-row { display:flex; gap:6px; margin-top:10px; }
    .tag-add-row input {
      flex:1; padding:8px 11px; border:1px solid #e0e0de; border-radius:7px;
      font-size:var(--fs-sm); color:#1a1a18; background:#fff;
      font-family:inherit; outline:none;
    }
    .tag-add-row input:focus { border-color:var(--accent); }
    .tag-add-row button {
      padding:8px 14px; border:none; border-radius:7px;
      background:var(--accent); color:#fff; cursor:pointer;
      font-size:var(--fs-sm); font-weight:600; font-family:inherit;
    }
    .tag-add-row button:disabled { opacity:.4; cursor:not-allowed; }

    /* About */
    .about-card {
      background:#fff; border:1px solid #ebebea; border-radius:12px;
      padding:16px; text-align:center;
    }
    .about-app-name { font-size:17px; font-weight:700; letter-spacing:-.5px; color:#1a1a18; margin-bottom:3px; }
    .about-version  { font-size:var(--fs-xs); color:#a0a09c; }

    /* TODO check sparkle */
    .todo-item { position:relative; overflow:visible; }
    .todo-sparkle { position:absolute; left:20px; top:50%; width:0; height:0; pointer-events:none; z-index:20; }
    .todo-sparkle span {
      position:absolute; width:7px; height:7px; border-radius:50%; opacity:0;
      animation:todo-spark .65s ease-out forwards;
    }
    @keyframes todo-spark {
      0%   { opacity:1; transform:translate(0,0) scale(1.3); }
      60%  { opacity:.8; }
      100% { opacity:0; transform:translate(var(--dx), var(--dy)) scale(0); }
    }

    /* ── Dark mode ───────────────────────────────── */
    .app.dark { color:#f0f0ee; }
    .app.dark .app-header { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .app-header h1 { color:#f0f0ee; }
    .app.dark .tagline { color:#6a6a68; }
    .app.dark .coin-badge { background:rgba(255,255,255,.08); }
    .app.dark .bottom-nav { background:#1e1e21; }
    .app.dark .bottom-nav-wrapper { /* inherits from .bottom-nav */ }
    .app.dark .nav-tab .nav-label { color:#5a5a58; }

    /* Boss TODO */
    .boss-item {
      background:linear-gradient(135deg, #fffde7 0%, #fff8e1 100%);
      border:2px solid #ffd700; border-radius:12px;
      padding:12px 14px; margin-bottom:10px;
      display:flex; align-items:center; gap:10px;
      animation:boss-pulse 2.5s ease-in-out infinite;
    }
    @keyframes boss-pulse {
      0%, 100% { box-shadow:0 0 0 0 rgba(255,215,0,.5); }
      50%       { box-shadow:0 0 0 10px rgba(255,215,0,0); }
    }
    .boss-crown { font-size:26px; flex-shrink:0; }
    .boss-body { flex:1; min-width:0; }
    .boss-title { font-size:13px; font-weight:700; color:#7a5200; line-height:1.45; }
    .boss-reward { font-size:11px; color:#c8860a; margin-top:3px; font-weight:600; }
    .boss-actions { display:flex; flex-direction:column; gap:4px; align-items:flex-end; flex-shrink:0; }
    .boss-complete-btn {
      background:linear-gradient(135deg, #ffd700, #ff9500); color:#4a2800;
      border:none; border-radius:8px; padding:7px 12px;
      font-size:12px; font-weight:800; cursor:pointer; font-family:inherit;
      box-shadow:0 2px 8px rgba(255,200,0,.4); white-space:nowrap;
      transition:transform .12s, box-shadow .12s;
    }
    .boss-complete-btn:active { transform:scale(.95); }
    .boss-dismiss-btn {
      width:20px; height:20px; border:1px solid #e8d066; background:transparent;
      border-radius:50%; cursor:pointer; font-size:9px; color:#b09030;
      display:flex; align-items:center; justify-content:center; transition:background .12s;
    }
    .boss-dismiss-btn:hover { background:rgba(255,215,0,.2); }
    .app.dark .boss-item { background:linear-gradient(135deg, #2a2000 0%, #1e1800 100%); border-color:#6b5500; }

    .app.dark .boss-reward { color:#c8a000; }
    .app.dark .boss-dismiss-btn { border-color:#4a3800; color:#8a6a00; }

    /* Sparkle burst overlay (memo→items reflection) */
    .sparkle-burst {
      position:absolute; pointer-events:none; z-index:250;
      width:0; height:0; left:50%; top:50%;
    }
    .sparkle-burst span {
      position:absolute; left:0; top:0;
      width:6px; height:6px; border-radius:50%;
      background:var(--accent); opacity:0;
      animation: spark-fly .9s ease-out forwards;
    }
    @keyframes spark-fly {
      0%   { opacity:1; transform:translate(0,0) scale(.6); }
      80%  { opacity:1; }
      100% { opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.1); }
    }

<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update().catch(() => {});
      }).catch(() => {});
    });
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
</script>

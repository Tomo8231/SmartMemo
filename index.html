<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SmartMemo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#D4622A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SmartMemo" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      height:100%; height:100dvh; width:100%; background:#fafaf9;
      font-family:'Inter',-apple-system,sans-serif;
      overscroll-behavior:none;
      -webkit-font-smoothing:antialiased;
      overflow:hidden;
    }
    #root { width:100%; height:100%; display:flex; justify-content:center; background:#e8e8e6; }

    /* Mobile / installed PWA — safe-area inserts */
    @media (max-width:500px), (display-mode:standalone) {
      .app-header   { padding-top:calc(14px + env(safe-area-inset-top)); }
      .bottom-nav { padding-bottom:calc(8px + env(safe-area-inset-bottom)); }
      .bottom-nav-wrapper { /* safe area is handled by .bottom-nav padding */ }
      .toast        { top:calc(20px + env(safe-area-inset-top)); }
      .modal-sheet, .confirm-sheet { padding-bottom:calc(32px + env(safe-area-inset-bottom)); }
      /* Prevent iOS auto-zoom on focus: form inputs must be ≥16px */
      .memo-textarea, .modal-field input, .modal-field select {
        font-size:max(16px, var(--fs-base));
      }
    }
    button { -webkit-appearance:none; appearance:none; }

    /* CSS Variables (theme) — applied to root .app which fills the viewport */
    .app {
      --accent:       #D4622A;
      --accent-light: rgba(212,98,42,0.10);
      --accent-text:  #fff;
      --fs-base:      14px;
      --fs-sm:        12px;
      --fs-xs:        11px;
      --fs-lg:        16px;

      width:100%; height:100%;
      display:flex; flex-direction:column;
      background:#fafaf9; color:#1a1a18;
      overflow:hidden; position:relative;
      font-size:var(--fs-base);
    }

    /* Header */
    .app-header {
      padding:14px 20px 12px;
      background:#fafaf9; border-bottom:1px solid #ebebea;
      display:flex; align-items:center; justify-content:space-between;
      flex:0 0 auto;
      min-height:50px;
    }
    .header-left { display:flex; align-items:baseline; gap:8px; }
    .app-header h1 { font-size:18px; font-weight:700; letter-spacing:-0.6px; color:#1a1a18; }
    .app-header .tagline { font-size:var(--fs-xs); color:#a0a09c; }
    .coin-badge {
      display:flex; align-items:center; gap:5px;
      background:var(--accent-light); border-radius:20px;
      padding:5px 10px 5px 8px; border:none; cursor:pointer;
      flex-shrink:0; transition:opacity .15s;
    }
    .coin-badge:active { opacity:.75; }
    .coin-badge-count { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:-.2px; }
    .coin-badge-gacha { font-size:10px; font-weight:700; color:var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:1px 5px; letter-spacing:.2px; }

    /* Gacha modal */
    .gacha-backdrop { align-items:center; justify-content:center; background:rgba(8,8,24,.92); }
    .gacha-modal {
      background:linear-gradient(160deg,#1a1a2e 0%,#16213e 55%,#0f3460 100%);
      border:1px solid rgba(255,255,255,.1); border-radius:24px;
      padding:22px 20px 26px; width:calc(100% - 32px); max-width:380px;
      min-height:440px; overflow:hidden;
      position:relative; display:flex; flex-direction:column; align-items:center; gap:12px;
      box-shadow:0 16px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
    }
    .gacha-modal::before {
      content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
      background-image:radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1px),
                       radial-gradient(circle,rgba(255,255,255,.25) 1px,transparent 1px);
      background-size:55px 55px,27px 27px;
      background-position:0 0,14px 14px;
      animation:star-drift 18s linear infinite;
    }
    @keyframes star-drift { to { background-position:55px 55px,41px 41px; } }
    .gacha-close-btn {
      position:absolute; top:12px; right:12px; z-index:2;
      background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15);
      width:30px; height:30px; border-radius:50%;
      font-size:13px; color:rgba(255,255,255,.65); cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:background .12s;
    }
    .gacha-close-btn:hover { background:rgba(255,255,255,.2); }
    .gacha-title {
      font-size:22px; font-weight:800; letter-spacing:1px; position:relative; z-index:1;
      background:linear-gradient(135deg,#ffd700 0%,#ff6b35 50%,#e91e63 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .gacha-cost-info { display:flex; align-items:center; gap:4px; font-size:13px; color:rgba(255,255,255,.45); position:relative; z-index:1; }
    .gacha-mode-btn {
      padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer;
      border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.07); color:rgba(255,255,255,.55);
      transition:background .15s,color .15s,border-color .15s;
    }
    .gacha-mode-btn.active { background:rgba(255,255,255,.18); color:#fff; border-color:rgba(255,255,255,.4); }
    /* Capsule wrap & orbiting stars */
    .gacha-capsule-wrap {
      position:relative; display:flex; align-items:center; justify-content:center;
      width:180px; height:180px; flex-shrink:0; z-index:1;
    }
    .gacha-capsule {
      width:145px; height:145px; border-radius:50%;
      background:var(--accent);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 24px rgba(212,98,42,.4);
      position:relative; overflow:hidden; z-index:1;
    }
    .gacha-capsule.spinning { animation:gacha-spin 1.6s ease-in-out forwards; }
    .gacha-capsule.revealed { animation:gacha-reveal .6s cubic-bezier(.17,.67,.34,1.4) forwards; }
    @keyframes gacha-spin {
      0%   { transform:rotate(0deg)   scale(1);    filter:brightness(1); }
      12%  { transform:rotate(150deg) scale(1.3);  filter:brightness(2); }
      32%  { transform:rotate(400deg) scale(.8);   filter:brightness(.7); }
      55%  { transform:rotate(610deg) scale(1.28); filter:brightness(2.2); }
      75%  { transform:rotate(690deg) scale(.92);  filter:brightness(1.3); }
      100% { transform:rotate(720deg) scale(1);    filter:brightness(1); }
    }
    @keyframes gacha-reveal {
      0%   { transform:scale(.08) rotate(-200deg); opacity:0; filter:brightness(5); }
      45%  { transform:scale(1.32) rotate(12deg);  opacity:1; }
      72%  { transform:scale(.91) rotate(-5deg); }
      100% { transform:scale(1) rotate(0deg); filter:brightness(1); }
    }
    .gacha-flash {
      position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,200,140,.5) 50%, transparent 80%);
      animation:gacha-flash-anim 1.6s ease-out forwards; pointer-events:none;
    }
    @keyframes gacha-flash-anim {
      0%   { opacity:0; transform:scale(.3); }
      14%  { opacity:1; transform:scale(1.15); }
      50%  { opacity:.55; }
      100% { opacity:0; transform:scale(1.45); }
    }
    /* Rotating beam rays */
    .gacha-beam { position:absolute; inset:-18px; border-radius:50%; pointer-events:none; animation:beam-spin 3s linear infinite; filter:blur(5px); }
    @keyframes beam-spin { to { transform:rotate(360deg); } }
    .gacha-beam-ultra { background:conic-gradient(from 0deg,transparent 0 8deg,rgba(255,215,0,.5) 8 18deg,transparent 18 65deg,rgba(255,107,53,.45) 65 75deg,transparent 75 125deg,rgba(233,30,99,.5) 125 135deg,transparent 135 185deg,rgba(156,39,176,.45) 185 195deg,transparent 195 245deg,rgba(255,215,0,.5) 245 255deg,transparent 255 310deg,rgba(255,107,53,.45) 310 320deg,transparent 320 360deg); }
    .gacha-beam-super { background:conic-gradient(from 0deg,transparent 0 10deg,rgba(210,150,255,.55) 10 24deg,transparent 24 90deg,rgba(255,215,0,.45) 90 104deg,transparent 104 185deg,rgba(210,150,255,.55) 185 199deg,transparent 199 270deg,rgba(255,215,0,.45) 270 284deg,transparent 284 360deg); }
    /* Orbiting star rings */
    .gacha-orbit-ring {
      position:absolute; top:50%; left:50%; width:0; height:0; pointer-events:none;
      animation:orbit-spin var(--dur,1.5s) linear infinite;
      animation-delay:var(--delay,0s);
    }
    .gacha-orbit-ring::before {
      content:''; position:absolute;
      width:var(--sz,8px); height:var(--sz,8px); border-radius:50%;
      background:var(--dot-color,#ffd700);
      top:calc(-76px); left:calc(var(--sz,8px) / -2);
      box-shadow:0 0 8px var(--dot-color,#ffd700), 0 0 16px var(--dot-color,#ffd700);
    }
    @keyframes orbit-spin { from { transform:rotate(var(--rot,0deg)); } to { transform:rotate(calc(var(--rot,0deg) + 360deg)); } }
    /* Particle burst */
    .gacha-particle {
      position:absolute; top:50%; left:50%; border-radius:50%; pointer-events:none;
      animation:particle-fly var(--dur,.85s) ease-out var(--delay,0s) both;
    }
    @keyframes particle-fly {
      0%   { transform:translate(-50%,-50%) scale(1.2); opacity:1; }
      100% { transform:translate(calc(-50% + var(--tx,0px)),calc(-50% + var(--ty,0px))) scale(0); opacity:0; }
    }
    /* Rarity full-screen flash */
    .gacha-rarity-flash {
      position:fixed; inset:0; z-index:9500; pointer-events:none;
      animation:rarity-flash-anim .75s ease-out forwards;
    }
    .gacha-rarity-flash.ultra { background:radial-gradient(circle at 50% 50%,rgba(255,215,0,.88) 0%,rgba(255,107,53,.65) 30%,rgba(233,30,99,.45) 60%,transparent 100%); }
    .gacha-rarity-flash.super { background:radial-gradient(circle at 50% 50%,rgba(235,180,255,.85) 0%,rgba(156,39,176,.55) 45%,transparent 100%); }
    .gacha-rarity-flash.rare  { background:radial-gradient(circle at 50% 50%,rgba(175,215,255,.75) 0%,rgba(21,101,192,.45) 50%,transparent 100%); }
    @keyframes rarity-flash-anim {
      0%   { opacity:0; transform:scale(.35); }
      22%  { opacity:1; transform:scale(1); }
      100% { opacity:0; transform:scale(1.5); }
    }
    .gacha-capsule-inner {
      width:58px; height:58px; border-radius:50%;
      background:rgba(255,255,255,.3); box-shadow:inset 0 2px 12px rgba(0,0,0,.15);
      display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:900; color:#fff;
    }
    .gacha-result-area {
      min-height:80px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:6px; width:100%; position:relative; z-index:1;
    }
    .gacha-result { display:flex; flex-direction:column; align-items:center; gap:4px; }
    .gacha-result-rarity { font-size:18px; letter-spacing:5px; animation:star-glow-anim 1.2s ease-in-out infinite alternate; }
    @keyframes star-glow-anim {
      from { text-shadow:0 0 4px currentColor; opacity:.85; }
      to   { text-shadow:0 0 18px currentColor, 0 0 36px currentColor; opacity:1; }
    }
    .gacha-result-label { font-size:30px; line-height:1; animation:result-pop .5s cubic-bezier(.17,.67,.34,1.6) both; }
    @keyframes result-pop { from { transform:scale(0) rotate(-18deg); } to { transform:scale(1) rotate(0deg); } }
    .gacha-result-name { font-size:15px; font-weight:700; text-align:center; color:#fff; }
    .gacha-result-desc { font-size:12px; text-align:center; background:rgba(255,255,255,.1); border-radius:8px; padding:6px 14px; width:100%; color:rgba(255,255,255,.6); }
    .gacha-coin-display { display:flex; align-items:center; gap:4px; font-size:13px; color:rgba(255,255,255,.4); position:relative; z-index:1; }
    /* Pull button with shimmer */
    .gacha-pull-btn {
      width:100%; padding:14px 24px; border:none; border-radius:14px;
      background:linear-gradient(135deg,#ffd700 0%,#ff6b35 50%,#e91e63 100%);
      color:#fff; font-size:var(--fs-base); font-weight:800; cursor:pointer; font-family:inherit;
      transition:opacity .15s,transform .1s;
      position:relative; overflow:hidden; z-index:1;
      box-shadow:0 4px 20px rgba(255,107,53,.45);
    }
    .gacha-pull-btn::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.38) 50%,transparent 100%);
      background-size:200% 100%;
      animation:btn-shimmer 2.5s linear infinite;
    }
    @keyframes btn-shimmer { from{background-position:200% 0} to{background-position:-200% 0} }
    .gacha-pull-btn:not(:disabled):hover { opacity:.88; }
    .gacha-pull-btn:not(:disabled):active { transform:scale(.97); }
    .gacha-pull-btn:disabled { opacity:.3; cursor:not-allowed; background:rgba(255,255,255,.14); box-shadow:none; }
    .gacha-pull-btn:disabled::after { display:none; }
    /* 10-pull grid */
    .gacha-ten-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:100%; position:relative; z-index:1; }
    .gacha-ten-card { border-radius:12px; padding:8px 4px; text-align:center; opacity:0; }
    .gacha-ten-card.show { animation:card-flip .42s cubic-bezier(.17,.67,.34,1.4) forwards; }
    @keyframes card-flip { from{opacity:0;transform:rotateY(90deg) scale(.7)} to{opacity:1;transform:rotateY(0deg) scale(1)} }

    /* Tab content */
    .tab-content {
      flex:1; min-height:0;
      display:flex; flex-direction:column;
      overflow:hidden;
    }
    .tab-pane {
      flex:1; min-height:0;
      overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
    }
    .tab-pane::-webkit-scrollbar { display:none; }
    .tab-pane > * { flex-shrink:0; }

    /* Bottom nav */
    .bottom-nav-wrapper {
      position:relative; flex:0 0 auto;
      isolation:isolate;
    }
    .bottom-nav {
      display:flex; background:#fff;
      box-shadow:0 -2px 14px rgba(0,0,0,.09);
      border-radius:20px 20px 0 0;
      padding:4px 0 6px;
      align-items:flex-end;
      width:100%;
    }
    .nav-tab {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:flex-end;
      gap:3px; cursor:pointer; padding-bottom:5px; min-height:54px;
    }
    .nav-mic-slot {
      width:72px; flex-shrink:0; /* empty placeholder aligned with mic button */
    }
    .nav-center-mic {
      position:absolute;
      left:50%; transform:translateX(-50%);
      bottom:calc(100% - 46px);
      width:62px; height:62px; border-radius:50%; border:none;
      background:var(--accent); color:#fff;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 16px rgba(0,0,0,.26);
      cursor:pointer;
      transition:transform .15s, box-shadow .15s;
    }
    .nav-center-mic:active { transform:translateX(-50%) scale(.91); box-shadow:0 2px 8px rgba(0,0,0,.14); }
    /* Copy button for TODO/Idea items */
    .item-copy-btn {
      width:24px; height:24px; border:1px solid #ebebea; background:#fff;
      border-radius:6px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; color:#b0b0ba;
      flex-shrink:0; transition:background .12s, color .12s;
    }
    .item-copy-btn:hover { background:#f0f5ff; color:#2e7bef; border-color:#cce0ff; }
    .nav-tab .nav-icon svg { transition:all 0.2s; width:24px; height:24px; }
    .nav-tab .nav-label { font-size:11px; font-weight:500; color:#c0c0ba; letter-spacing:0.2px; transition:color 0.2s; }
    .nav-tab.active .nav-label { color:var(--accent); }
    .nav-tab.pulse { animation: nav-pulse .9s ease-out 1; }
    @keyframes nav-pulse {
      0%   { transform:scale(1); }
      35%  { transform:scale(1.18); }
      70%  { transform:scale(.96); }
      100% { transform:scale(1); }
    }

    /* Loading overlay */
    .loading-overlay {
      position:absolute; inset:0;
      background:rgba(250,250,249,0.92); backdrop-filter:blur(6px);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      z-index:100;
    }
    .spinner {
      width:30px; height:30px;
      border:2px solid #e0e0de; border-top-color:var(--accent);
      border-radius:50%; animation:spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-text { font-size:var(--fs-base); font-weight:500; color:#1a1a18; }
    .loading-sub  { font-size:var(--fs-sm); color:#a0a09c; }

    /* Toast */
    .toast {
      position:absolute; top:64px; left:16px; right:16px;
      background:#1a1a18; color:#fafaf9; border-radius:10px;
      padding:11px 14px; font-size:var(--fs-sm); font-weight:500;
      z-index:200; animation:toastIn .25s ease, toastOut .25s 2.3s ease forwards;
    }
    @keyframes toastIn  { from{transform:translateY(-8px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes toastOut { to{opacity:0} }

    /* Tag pill */
    .tag-pill {
      display:inline-flex; align-items:center;
      padding:2px 7px; border-radius:4px;
      font-size:10px; font-weight:600; letter-spacing:0.2px;
      background:var(--accent-light); color:var(--accent);
    }

    /* MEMO TAB */
    .memo-tab { padding:0; display:flex; flex-direction:column; gap:0; overflow:hidden; }
    .memo-card { background:#fff; border:none; border-bottom:1px solid #ebebea; border-radius:0; overflow:hidden; flex:1; min-height:0; display:flex; flex-direction:column; }
    .memo-tab > .memo-card { flex:1; }
    .memo-card-top {
      padding:12px 14px 0;
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .memo-card-label { font-size:var(--fs-xs); font-weight:600; color:#a0a09c; letter-spacing:0.6px; text-transform:uppercase; }
    .memo-char-count { font-size:var(--fs-xs); color:#c0c0ba; }
    .memo-textarea {
      width:100%; padding:10px 14px 12px;
      border:none; outline:none; resize:none;
      flex:1; min-height:0;
      font-size:var(--fs-base); font-weight:400; line-height:1.65;
      color:#1a1a18; background:transparent; font-family:inherit;
      overflow-y:auto; -webkit-overflow-scrolling:touch;
    }
    .memo-textarea::placeholder { color:#c8c8c4; }
    .memo-actions {
      padding:8px 12px 10px; border-top:1px solid #f0f0ee; display:flex; gap:6px; flex-shrink:0;
    }
    .reflect-actions { padding:12px 16px; flex-shrink:0; }
    .memo-history-sheet {
      background:#fafaf9; border-radius:18px 18px 0 0;
      width:100%; max-height:75vh;
      display:flex; flex-direction:column;
      padding:16px 0 0;
      animation:sheetUp .25s ease;
    }
    .memo-history-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:0 18px 12px; border-bottom:1px solid #ebebea; flex-shrink:0;
    }
    .memo-history-list { overflow-y:auto; flex:1; }
    .memo-history-item {
      display:flex; align-items:flex-start; gap:10px;
      padding:12px 18px; cursor:pointer;
      border-bottom:1px solid #f0f0ee; transition:background .1s;
    }
    .memo-history-item:hover { background:#f5f5f3; }
    .memo-history-info { flex:1; min-width:0; }
    .memo-history-date { font-size:11px; color:#a0a09c; margin-bottom:3px; }
    .memo-history-text {
      font-size:13px; color:#1a1a18; line-height:1.5;
      overflow:hidden; display:-webkit-box;
      -webkit-line-clamp:2; -webkit-box-orient:vertical;
    }
    .memo-history-del {
      background:none; border:none; color:#c0c0ba;
      font-size:13px; cursor:pointer; padding:2px 4px; flex-shrink:0; line-height:1;
    }
    .memo-history-del:hover { color:#e53935; }
    .memo-history-clear {
      background:none; border:none; color:#c0c0ba;
      font-size:12px; cursor:pointer; font-family:inherit;
    }
    .memo-history-clear:hover { color:#e53935; }
    .memo-history-empty {
      text-align:center; color:#a0a09c; font-size:14px; padding:48px 0;
    }
    .action-btn {
      display:flex; align-items:center; gap:5px;
      padding:6px 11px; border-radius:7px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-xs); font-weight:500;
      color:#4a4a48; font-family:inherit; transition:background .12s;
    }
    .action-btn:hover { background:#f5f5f3; }
    .action-btn.recording { background:#1a1a18; border-color:#1a1a18; color:#fff; }
    .pulse-dot {
      width:8px; height:8px; border-radius:50%;
      background:#fff; display:inline-block;
      animation: rec-pulse 1s ease-in-out infinite;
    }
    @keyframes rec-pulse {
      0%, 100% { opacity:1; transform:scale(1); }
      50%      { opacity:.45; transform:scale(.78); }
    }

    .img-preview { position:relative; overflow:hidden; border-top:1px solid #ebebea; flex-shrink:0; }
    .img-preview img { width:100%; max-height:130px; object-fit:cover; display:block; }
    .img-clear {
      position:absolute; top:6px; right:6px; width:22px; height:22px;
      border-radius:50%; background:rgba(0,0,0,.45); border:none; color:#fff;
      font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }

    .reflect-btn {
      width:100%; padding:15px; border:none; border-radius:12px;
      background:var(--accent); color:var(--accent-text);
      font-size:var(--fs-base); font-weight:600; letter-spacing:-0.2px;
      cursor:pointer; font-family:inherit;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:opacity .15s, transform .1s;
      position:relative; overflow:hidden;
    }
    .reflect-btn:hover   { opacity:.88; }
    .reflect-btn:active  { transform:scale(.98); }
    .reflect-btn:disabled { opacity:.4; cursor:not-allowed; }
    /* AI shine sweep on hover */
    .reflect-btn::after {
      content:''; position:absolute; top:0; bottom:0; left:-40%; width:35%;
      background:linear-gradient(110deg, transparent 0%, rgba(255,255,255,.28) 50%, transparent 100%);
      transform:skewX(-16deg);
      transition:left .65s ease;
      pointer-events:none;
    }
    .reflect-btn:hover::after { left:120%; }

    .hint-card { background:#fff; border:1px solid #ebebea; border-radius:12px; padding:12px 14px; }
    .hint-title { font-size:var(--fs-xs); font-weight:600; color:#4a4a48; margin-bottom:6px; }
    .hint-body  { font-size:var(--fs-xs); color:#a0a09c; line-height:1.8; }

    /* TODO TAB */
    .todo-tab {
      display:flex; flex-direction:column;
      flex:1; min-height:0;
      overflow:hidden;
    }
    .todo-pane-left { flex-shrink:0; width:100%; min-width:0; overflow-x:hidden; }
    .todo-pane-right { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    @media (min-width:760px) {
      .todo-tab { flex-direction:row; }
      .todo-pane-left {
        flex:0 0 min(380px, 42%); width:auto; display:flex; flex-direction:column;
        border-right:1px solid #ebebea; overflow-y:auto; overflow-x:hidden;
      }
      .todo-pane-left .calendar-section,
      .todo-pane-left .calendar-section.hide {
        max-height:none; flex:1; overflow:auto; border-bottom:none;
      }
      .todo-pane-left .todo-list-header { border-bottom:none; }
      .cal-toggle { display:none; }
    }

    .todo-controls {
      padding:12px 16px; background:#fff; border-bottom:1px solid #ebebea;
      flex-shrink:0;
    }
    .search-box {
      margin-bottom:8px;
    }
    .search-input {
      width:100%; padding:9px 12px; border:1px solid #e0e0de;
      border-radius:8px; font-size:var(--fs-base); font-family:inherit;
      outline:none; color:#1a1a18; background:#fafaf9;
    }
    .search-input:focus { border-color:var(--accent); background:#fff; }
    .filter-tags {
      display:flex; gap:6px; flex-wrap:wrap;
    }
    .filter-tag {
      padding:6px 11px; border-radius:6px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-xs);
      font-weight:500; color:#4a4a48; transition:all .12s; font-family:inherit;
    }
    .filter-tag:hover { background:#f5f5f3; }
    .filter-tag.active { background:var(--accent); border-color:var(--accent); color:#fff; }

    .calendar-section {
      background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0;
      overflow:hidden;
      max-height:520px;
      transition:max-height .38s cubic-bezier(.4,0,.2,1);
    }
    .calendar-section.hide {
      max-height:0;
      border-bottom-color:transparent;
    }

    .cal-wrapper { background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0; overflow:hidden; width:100%; }
    .cal-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 16px 6px;
    }
    .cal-month-label { font-size:var(--fs-base); font-weight:700; letter-spacing:-.3px; }
    .cal-nav { display:flex; gap:2px; }
    .cal-nav-btn {
      width:26px; height:26px; border:1px solid #e0e0de; background:#fff;
      border-radius:6px; cursor:pointer; font-size:13px; color:#4a4a48;
      display:flex; align-items:center; justify-content:center; transition:background .12s;
    }
    .cal-nav-btn:hover { background:#f5f5f3; }
    .cal-today-btn {
      height:26px; padding:0 8px; border:1px solid #e0e0de; background:#fff;
      border-radius:6px; cursor:pointer; font-size:10px; font-weight:700; color:var(--accent);
      font-family:inherit; transition:background .12s;
    }
    .cal-today-btn:hover { background:#f5f5f3; }
    .cal-dow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); padding:0 10px; }
    .cal-dow-cell { text-align:center; font-size:10px; font-weight:600; color:#b0b0ac; padding:3px 0; }
    /* ── Calendar grid (week-row based) ── */
    .cal-grid-rows { padding:2px 8px 8px; display:flex; flex-direction:column; gap:0; }
    .cal-grid-rows.cal-slide-prev { animation: cal-slide-out-left .2s ease forwards; }
    .cal-grid-rows.cal-slide-next { animation: cal-slide-out-right .2s ease forwards; }
    @keyframes cal-slide-out-left {
      from { transform:translateX(0); opacity:1; }
      to   { transform:translateX(-100%); opacity:0; }
    }
    @keyframes cal-slide-out-right {
      from { transform:translateX(0); opacity:1; }
      to   { transform:translateX(100%); opacity:0; }
    }
    .cal-week-row { display:flex; flex-direction:column; margin-bottom:3px; }
    .cal-week-cells {
      display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px;
    }
    .cal-cell {
      height:24px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; border-radius:6px; transition:background .1s;
      min-width:0; position:relative;
    }
    .cal-cell:hover { background:#f5f5f3; }
    .cal-num {
      font-size:12px; font-weight:400; color:#1a1a18;
      width:20px; height:20px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; line-height:1;
    }
    .cal-cell.other-month .cal-num { color:#d0d0cc; }
    .cal-cell.today .cal-num { background:#1a1a18; color:#fff; font-weight:700; }
    .cal-cell.selected .cal-num { background:var(--accent); color:#fff; font-weight:700; }

    /* ── Event bar layer ── */
    .cal-event-layer {
      display:grid; grid-template-columns:repeat(7,minmax(0,1fr));
      grid-auto-rows:14px; gap:2px 0; padding:2px 0 1px;
    }
    .cal-span-bar {
      height:14px; display:flex; align-items:center; overflow:hidden;
      cursor:pointer; border-radius:3px; margin:0 1px;
    }
    .cal-span-bar.multi { background:var(--accent); color:#fff; }
    .cal-span-bar.single { background:var(--accent-light); color:var(--accent); }
    .cal-span-bar.done.multi { background:#c8c8c4; color:#888; }
    .cal-span-bar.done.single { background:rgba(0,0,0,.04); color:#b0b0aa; }
    .cal-span-bar.done .cal-span-label { text-decoration:line-through; }
    .cal-span-bar.no-l { border-top-left-radius:0; border-bottom-left-radius:0; margin-left:0; }
    .cal-span-bar.no-r { border-top-right-radius:0; border-bottom-right-radius:0; margin-right:0; }
    .cal-span-label {
      font-size:8px; font-weight:600; padding:0 3px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      flex:1; min-width:0;
    }
    .cal-bar-more {
      height:14px; font-size:7px; font-weight:700; color:var(--accent);
      display:flex; align-items:center; justify-content:center; cursor:pointer;
    }

    .todo-list-area {
      padding:16px;
      flex:1; min-height:0;
      overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
    }
    .todo-list-header {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 16px; flex-shrink:0; gap:8px;
      background:#fff; border-bottom:1px solid #f0f0ee;
    }
    .calendar-mode-toggle {
      display:flex; gap:4px;
    }
    .mode-btn {
      padding:6px 10px; border-radius:6px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-sm); font-weight:500;
      color:#4a4a48; transition:all .12s; font-family:inherit;
    }
    .mode-btn:hover { background:#f5f5f3; }
    .mode-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

    .cal-toggle {
      display:flex; align-items:center; justify-content:center; gap:4px;
      padding:6px 10px; border-radius:8px; border:1px solid #ebebea;
      background:#fff; cursor:pointer; color:#4a4a48;
      transition:background .12s; flex-shrink:0;
    }
    .cal-toggle:hover { background:#f5f5f3; }
    .todo-list-area::-webkit-scrollbar { display:none; }
    .section-head { display:flex; align-items:center; gap:7px; margin-bottom:10px; }
    .section-head-label { font-size:var(--fs-xs); font-weight:600; color:#a0a09c; text-transform:uppercase; letter-spacing:.5px; }
    .section-count { font-size:10px; font-weight:700; background:var(--accent); color:#fff; border-radius:10px; padding:1px 7px; }
    .todo-empty { text-align:center; padding:28px 0 10px; color:#c0c0ba; font-size:var(--fs-sm); }
    .divider { height:1px; background:#ebebea; margin:14px 0; }
    .overdue-head { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
    .overdue-head .section-head-label { color:#c0392b !important; }
    .overdue-head .section-count { background:#c0392b !important; }
    .todo-item.overdue { border-color:#f8d0cb; background:#fff8f7; }
    .todo-item.overdue .todo-title { color:#c0392b; }
    .todo-item.overdue .todo-date-str { color:#c0392b; }
    .undated-head { cursor:pointer; user-select:none; }
    .undated-head:active { opacity:.7; }
    .undated-arrow { margin-left:auto; font-size:11px; color:#a0a09c; }
    .undated-body { overflow:hidden; max-height:2000px; transition:max-height .35s cubic-bezier(.4,0,.2,1); }
    .undated-body.closed { max-height:0; }

    /* Todo item */
    .todo-item {
      background:#fff; border:1px solid #ebebea; border-radius:10px;
      padding:11px 12px; margin-bottom:7px;
      display:flex; align-items:flex-start; gap:10px; transition:opacity .2s;
    }
    .todo-item.done { opacity:.45; }
    .todo-check {
      width:18px; height:18px; border-radius:50%; border:1.5px solid #c0c0ba;
      flex-shrink:0; margin-top:2px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .15s; background:#fff;
    }
    .todo-check.checked { background:var(--accent); border-color:var(--accent); }
    .todo-check.animate-pop { animation: complete-pop .42s cubic-bezier(.34,1.56,.64,1); }
    @keyframes complete-pop {
      0%   { transform:scale(1); box-shadow:0 0 0 0 var(--accent-light); }
      40%  { transform:scale(1.45); box-shadow:0 0 0 10px var(--accent-light); }
      100% { transform:scale(1); box-shadow:0 0 0 0 rgba(0,0,0,0); }
    }
    .todo-item.animate-fade { animation: complete-fade .55s ease; }
    @keyframes complete-fade {
      0%   { background:var(--accent-light); }
      100% { background:#fff; }
    }
    /* Item entrance — used after memo→TODO/idea reflection */
    .todo-item.just-added,
    .idea-card.just-added {
      animation: item-arrive .55s cubic-bezier(.32,.72,.32,1) both;
      box-shadow: 0 0 0 0 var(--accent-light);
    }
    @keyframes item-arrive {
      0%   { opacity:0; transform:translateY(-14px) scale(.96); box-shadow:0 0 0 0 var(--accent-light); }
      45%  { opacity:1; transform:translateY(2px)   scale(1.01); box-shadow:0 0 0 6px var(--accent-light); }
      100% { opacity:1; transform:translateY(0)     scale(1);    box-shadow:0 0 0 0 rgba(0,0,0,0); }
    }
    .todo-body { flex:1; min-width:0; cursor:pointer; }
    .todo-title { font-size:var(--fs-base); font-weight:500; color:#1a1a18; line-height:1.45; }
    .todo-item.done .todo-title { text-decoration:line-through; }
    .todo-meta { display:flex; align-items:center; gap:5px; margin-top:5px; flex-wrap:wrap; }
    .todo-date-str { font-size:10px; color:#b0b0ac; display:flex; align-items:center; gap:3px; }
    .todo-coin-reward { font-size:10px; font-weight:700; color:#b07000; background:#fff8e1; border-radius:6px; padding:1px 5px; letter-spacing:.1px; }
    .todo-item.done .todo-coin-reward { opacity:.45; }
    .todo-del {
      width:24px; height:24px; border:1px solid #ebebea; background:#fff;
      border-radius:6px; cursor:pointer; font-size:11px;
      display:flex; align-items:center; justify-content:center; color:#c0c0ba;
      flex-shrink:0; transition:background .12s, color .12s;
    }
    .todo-del:hover { background:#fdf0f0; color:#c0392b; border-color:#f0d0d0; }

    /* Edit Modal */
    .modal-backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      display:flex; align-items:flex-end; z-index:1000;
      animation:bdIn .2s ease;
    }
    @keyframes bdIn { from{opacity:0} to{opacity:1} }
    .modal-sheet {
      background:#fafaf9; border-radius:18px 18px 0 0;
      width:100%; padding:20px 18px 32px;
      animation:sheetUp .25s ease;
    }
    @keyframes sheetUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-handle { width:36px; height:4px; border-radius:2px; background:#d0d0cc; margin:0 auto 18px; }
    .modal-title { font-size:15px; font-weight:700; margin-bottom:16px; letter-spacing:-.3px; }
    .modal-field { margin-bottom:12px; }
    .modal-field label { display:block; font-size:var(--fs-xs); font-weight:600; color:#a0a09c; text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
    .modal-field input, .modal-field select {
      width:100%; padding:9px 11px; border:1px solid #e0e0de; border-radius:8px;
      font-size:var(--fs-base); color:#1a1a18; background:#fff; font-family:inherit; outline:none;
    }
    .modal-field input:focus, .modal-field select:focus { border-color:var(--accent); }
    .modal-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .modal-tags { display:flex; flex-wrap:wrap; gap:6px; }
    .modal-tag {
      padding:5px 10px; border-radius:6px; border:1px solid #e0e0de;
      font-size:var(--fs-xs); font-weight:500; cursor:pointer; background:#fff; color:#4a4a48;
      transition:all .12s;
    }
    .modal-tag.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
    .modal-recurring-note { margin-top:6px; font-size:var(--fs-xs); color:#a0a09c; }
    .modal-day-picker { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
    .modal-day-btn {
      width:28px; height:28px; border-radius:6px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:11px; font-weight:500;
      color:#4a4a48; font-family:inherit; transition:all .12s;
      display:flex; align-items:center; justify-content:center;
    }
    .modal-day-btn.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
    .modal-actions { display:flex; gap:8px; margin-top:18px; }
    .modal-cancel {
      flex:1; padding:12px; border:1px solid #e0e0de; border-radius:10px;
      background:#fff; font-size:var(--fs-base); font-weight:500; cursor:pointer; font-family:inherit;
    }
    .modal-save {
      flex:2; padding:12px; border:none; border-radius:10px;
      background:var(--accent); color:#fff;
      font-size:var(--fs-base); font-weight:600; cursor:pointer; font-family:inherit;
    }

    /* Confirm Sheet */
    .confirm-sheet {
      background:#fafaf9; border-radius:18px 18px 0 0;
      width:100%; max-height:88%; padding:20px 18px 96px;
      display:flex; flex-direction:column;
      animation:sheetUp .25s ease;
    }
    .confirm-sheet.swooshing { animation: sheet-swoosh .35s ease forwards; }
    @keyframes sheet-swoosh {
      to { transform:translateY(120%); opacity:0; }
    }
    .confirm-header { margin-bottom:12px; }
    .confirm-title { font-size:15px; font-weight:700; letter-spacing:-.3px; margin-bottom:4px; }
    .confirm-sub   { font-size:var(--fs-xs); color:#a0a09c; line-height:1.55; }
    .confirm-list  { flex:1; overflow-y:auto; min-height:60px; padding:2px 0 6px; }
    .confirm-list::-webkit-scrollbar { display:none; }
    .confirm-actions {
      display:flex; gap:8px; margin-top:12px;
      border-top:1px solid #ebebea; padding-top:14px;
    }
    .modal-save:disabled { opacity:.4; cursor:not-allowed; }
    .confirm-section-head {
      font-size:var(--fs-xs); font-weight:600; color:#a0a09c;
      text-transform:uppercase; letter-spacing:.5px;
      margin:8px 2px 6px;
    }
    .confirm-section-head:first-child { margin-top:0; }
    .merge-indicator {
      display:inline-block; font-size:10px; color:var(--accent);
      font-weight:600; margin-top:3px; margin-right:6px;
    }
    .modal-field textarea {
      width:100%; padding:9px 11px; border:1px solid #e0e0de; border-radius:8px;
      font-size:var(--fs-base); color:#1a1a18; background:#fff; font-family:inherit;
      outline:none; resize:vertical; min-height:84px; line-height:1.55;
    }
    .modal-field textarea:focus { border-color:var(--accent); }

    /* IDEAS TAB */
    .ideas-tab { padding:16px; display:flex; flex-direction:column; gap:8px; }
    .idea-card {
      background:#fff; border:1px solid #ebebea; border-radius:10px;
      padding:13px 14px; cursor:pointer; transition:background .12s;
      display:flex; gap:10px; align-items:flex-start;
    }
    .idea-card:hover { background:#fafaf9; }
    .idea-card-body { flex:1; min-width:0; }
    .idea-project {
      font-size:var(--fs-base); font-weight:600; color:#1a1a18;
      letter-spacing:-.2px; line-height:1.35;
    }
    .idea-summary { font-size:var(--fs-sm); color:#4a4a48; line-height:1.55; margin-top:4px; }
    .idea-details { list-style:none; margin-top:8px; display:flex; flex-direction:column; gap:4px; }
    .idea-detail {
      font-size:var(--fs-xs); color:#4a4a48; padding-left:14px;
      position:relative; line-height:1.55;
    }
    .idea-detail::before {
      content:''; position:absolute; left:4px; top:7px;
      width:4px; height:4px; border-radius:50%; background:var(--accent);
    }
    .idea-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .idea-updated { font-size:10px; color:#b0b0ac; }
    .ideas-empty {
      text-align:center; padding:60px 20px; color:#a0a09c;
      font-size:var(--fs-sm); line-height:1.7;
    }
    .ideas-wrapper { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
    .ideas-header-row { display:flex; align-items:center; background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0; }
    .ideas-header-row .ideas-subtabs { border-bottom:none; flex:1; min-width:0; }
    /* Add-row buttons — natural inline placement */
    .todo-add-row {
      display:flex; align-items:center; gap:7px;
      width:100%; padding:12px 16px;
      background:transparent; border:none; border-top:1px solid #f0f0ee;
      color:var(--accent); font-size:var(--fs-base); font-weight:500;
      cursor:pointer; text-align:left; font-family:inherit; letter-spacing:.1px;
    }
    .todo-add-row:active { background:#f5f5f3; }
    .trash-open-btn {
      display:flex; align-items:center; gap:6px;
      width:100%; padding:10px 16px;
      background:transparent; border:none; border-top:1px solid #f0f0ee;
      color:#a0a09c; font-size:var(--fs-sm); font-weight:500;
      cursor:pointer; text-align:left; font-family:inherit;
    }
    .trash-open-btn:active { background:#f5f5f3; }
    .trash-count {
      background:#c8c8c4; color:#fff; font-size:10px; font-weight:700;
      border-radius:10px; padding:1px 6px;
    }
    .trash-item {
      display:flex; align-items:center; gap:8px; padding:10px 16px;
      border-bottom:1px solid #f0f0ee; cursor:pointer;
    }
    .trash-item:hover { background:#f5f5f3; }
    .trash-item-info { flex:1; min-width:0; }
    .trash-item-title { font-size:13px; color:#1a1a18; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .trash-restore-btn {
      flex-shrink:0; padding:4px 10px; border-radius:6px;
      border:1px solid #e0e0de; background:#fff;
      color:var(--accent); font-size:11px; font-weight:600;
      cursor:pointer; font-family:inherit;
    }
    /* ── Lightbox ─────────────────────────────────────────── */
    .lightbox-overlay {
      position:fixed; inset:0; z-index:10000;
      background:rgba(0,0,0,.93);
      display:flex; flex-direction:column;
      padding-top:env(safe-area-inset-top,0px);
    }
    .lightbox-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px 10px; flex-shrink:0;
    }
    .lightbox-name {
      color:rgba(255,255,255,.8); font-size:13px; font-weight:500;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      max-width:calc(100% - 56px);
    }
    .lightbox-close {
      width:36px; height:36px; border-radius:50%; border:none; flex-shrink:0;
      background:rgba(255,255,255,.18); color:#fff; font-size:18px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .lightbox-dl-btn {
      width:36px; height:36px; border-radius:50%; border:none; flex-shrink:0;
      background:rgba(255,255,255,.12); color:#fff; font-size:16px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .lightbox-body {
      flex:1; display:flex; align-items:center; justify-content:center;
      overflow:hidden; padding:8px 12px 24px;
    }
    .lightbox-body.text {
      align-items:flex-start; overflow-y:auto; padding:12px 16px 32px;
    }
    .lightbox-img {
      max-width:100%; max-height:100%; object-fit:contain; border-radius:6px;
      display:block;
    }
    .lightbox-iframe {
      width:100%; height:100%; border:none; border-radius:6px; background:#fff;
    }
    .lightbox-text {
      width:100%; color:#e8e8e8; font-size:12px; line-height:1.7;
      font-family:monospace; white-space:pre-wrap; word-break:break-all;
      margin:0;
    }
    /* Link chip in modal attachment list */
    .attachment-link-chip {
      width:76px; height:76px; border-radius:10px;
      border:1px solid #c8e6c9; background:#f1f8f1;
      cursor:pointer; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:4px;
      box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .attachment-link-chip:active { opacity:.75; }
    /* Preview badge on file chips */
    .attachment-preview-badge {
      font-size:8px; color:var(--accent); font-weight:700;
      background:var(--accent-light); border-radius:3px; padding:1px 4px;
      margin-top:2px;
    }
    /* Link input row */
    .attachment-link-input-row {
      display:flex; align-items:center; gap:6px;
      margin-top:8px;
    }
    .attachment-link-url {
      flex:1; height:34px; border-radius:8px; border:1px solid #e0e0de;
      padding:0 10px; font-size:13px; font-family:inherit; outline:none;
      background:#fff;
    }
    .attachment-link-url:focus { border-color:var(--accent); }
    .attachment-link-confirm {
      height:34px; padding:0 12px; border-radius:8px;
      border:none; background:var(--accent); color:#fff;
      font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;
      white-space:nowrap; flex-shrink:0;
    }
    .attachment-link-cancel {
      width:34px; height:34px; border-radius:8px; border:1px solid #e0e0de;
      background:#fff; color:#888; font-size:14px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    /* Link chip in todo/idea row */
    .attachment-row-link {
      font-size:10px; color:#2e7d32; font-weight:600;
      border:1px solid #c8e6c9; background:#f1f8f1;
      border-radius:6px; padding:4px 8px; cursor:pointer;
      max-width:90px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    /* ── Attachment section (modals) ─────────────────────── */
    .attachment-list { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding-top:2px; }
    .attachment-chip { position:relative; }
    .attachment-thumb {
      width:76px; height:76px; object-fit:cover; border-radius:10px;
      border:1px solid #e0e0de; cursor:pointer; display:block;
      box-shadow:0 1px 4px rgba(0,0,0,.10);
      transition:opacity .12s;
    }
    .attachment-thumb:active { opacity:.75; }
    .attachment-file-chip {
      width:76px; height:76px; border-radius:10px;
      border:1px solid #d8eaff; background:#f0f6ff;
      cursor:pointer; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:4px;
      box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    .attachment-file-chip:active { opacity:.75; }
    .attachment-file-ico { font-size:22px; line-height:1; }
    .attachment-file-label {
      font-size:9px; color:var(--accent); font-weight:600;
      max-width:68px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      text-align:center; padding:0 4px;
    }
    .attachment-remove {
      position:absolute; top:-6px; right:-6px;
      width:18px; height:18px; border-radius:50%; border:none;
      background:#4a4a48; color:#fff; font-size:10px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      line-height:1; padding:0; box-shadow:0 1px 3px rgba(0,0,0,.25);
    }
    .attachment-add-btn {
      width:76px; height:76px; border-radius:10px;
      border:1.5px dashed #c8c8c4; background:#fafaf9;
      cursor:pointer; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:3px;
      transition:background .12s;
    }
    .attachment-add-btn:active { background:#f0f0ee; }
    .attachment-add-ico { font-size:22px; line-height:1; }
    .attachment-add-label { font-size:10px; font-weight:600; color:#a0a09c; font-family:inherit; }
    .modal-att-toast {
      font-size:11px; color:#e53e3e; background:#fff5f5;
      border:1px solid #fed7d7; border-radius:6px;
      padding:6px 10px; margin-bottom:8px;
    }
    /* Attachment row (todo/idea list) */
    .attachment-row { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
    .attachment-row-thumb {
      width:44px; height:44px; object-fit:cover; border-radius:7px;
      border:1px solid #e0e0de; cursor:pointer;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
    }
    .attachment-row-thumb:active { opacity:.75; }
    .attachment-row-more {
      width:44px; height:44px; border-radius:7px; background:#f0f0ee;
      color:#6a6a68; font-size:11px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }
    .attachment-row-file {
      font-size:10px; color:var(--accent); font-weight:600;
      border:1px solid #d8eaff; background:#f0f6ff;
      border-radius:6px; padding:4px 8px; cursor:pointer;
      max-width:90px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      display:flex; align-items:center; gap:3px;
    }
    /* Memo tab attachment area */
    .memo-att-list {
      display:flex; flex-wrap:wrap; gap:8px;
      padding:10px 14px 6px; border-top:1px solid #ebebea;
    }
    .memo-att-chip { position:relative; }
    .memo-att-thumb {
      width:60px; height:60px; object-fit:cover; border-radius:9px;
      border:1px solid #e0e0de; cursor:pointer; display:block;
      box-shadow:0 1px 4px rgba(0,0,0,.10);
    }
    .memo-att-thumb:active { opacity:.75; }
    .memo-att-file-chip {
      height:60px; min-width:60px; max-width:100px; border-radius:9px;
      border:1px solid #d8eaff; background:#f0f6ff;
      cursor:pointer; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:3px; padding:0 8px;
    }
    .memo-att-file-name {
      font-size:9px; color:var(--accent); font-weight:600;
      max-width:84px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .memo-att-remove {
      position:absolute; top:-6px; right:-6px;
      width:18px; height:18px; border-radius:50%; border:none;
      background:#4a4a48; color:#fff; font-size:10px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      line-height:1; padding:0; box-shadow:0 1px 3px rgba(0,0,0,.25);
    }
    .memo-att-badge {
      display:inline-flex; align-items:center; justify-content:center;
      background:var(--accent); color:#fff; font-size:9px; font-weight:700;
      border-radius:9px; min-width:16px; height:16px; padding:0 4px;
      margin-left:2px; line-height:1;
    }
    .ideas-add-row {
      display:flex; align-items:center; justify-content:center; gap:6px;
      margin:12px 16px; padding:12px;
      background:var(--accent-light); color:var(--accent);
      border:none; border-radius:12px; width:calc(100% - 32px);
      font-size:var(--fs-base); font-weight:600; cursor:pointer;
      font-family:inherit; transition:opacity .15s; flex-shrink:0;
    }
    .ideas-add-row:active { opacity:.7; }
    .ideas-subtabs {
      display:flex; align-items:center; overflow-x:auto;
      padding:0 16px; border-bottom:1px solid #ebebea;
      background:#fff; flex-shrink:0;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .ideas-subtabs::-webkit-scrollbar { display:none; }
    .ideas-subtab {
      padding:10px 12px; font-size:var(--fs-sm); font-weight:500; color:#a0a09c;
      cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
      transition:color .15s, border-color .15s; flex-shrink:0;
      display:inline-flex; align-items:center; gap:4px;
    }
    .ideas-subtab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .ideas-subtab:hover:not(.active) { color:#4a4a48; }
    .ideas-subtab.dragging { opacity:.45; }
    .ideas-subtab.drag-over { background:var(--accent-light); border-radius:4px 4px 0 0; color:var(--accent); }
    .ideas-subtab.drop-target { background:var(--accent-light); border-radius:4px 4px 0 0; }
    .idea-card[draggable] { cursor:grab; }
    .idea-card.dragging { opacity:.35; cursor:grabbing; }
    .idea-card.touch-dragging { opacity:.35; transform:scale(.97); box-shadow:0 4px 20px rgba(0,0,0,.15); }
    .idea-card.drag-over-top { box-shadow:0 -3px 0 0 var(--accent), 0 1px 4px rgba(0,0,0,.06); }
    .idea-card.drag-over-bottom { box-shadow:0 3px 0 0 var(--accent), 0 1px 4px rgba(0,0,0,.06); }
    .ideas-tab.touch-dragging { touch-action:none; user-select:none; }
    .ideas-subtab-del {
      width:14px; height:14px; border-radius:50%; background:transparent;
      border:none; cursor:pointer; color:#c0c0ba; font-size:10px;
      padding:0; display:inline-flex; align-items:center; justify-content:center;
    }
    .ideas-subtab-del:hover { color:#c0392b; background:#fdf0f0; }
    .ideas-subtab-add {
      padding:10px 10px; font-size:18px; color:#c0c0ba;
      cursor:pointer; flex-shrink:0; transition:color .15s; line-height:1;
    }
    .ideas-subtab-add:hover { color:var(--accent); }
    .ideas-subtab-input {
      display:flex; align-items:center; gap:6px;
      padding:8px 16px; background:#fff; border-bottom:1px solid #ebebea; flex-shrink:0;
    }
    .ideas-subtab-input input {
      flex:1; padding:6px 10px; border:1px solid #e0e0de; border-radius:7px;
      font-size:var(--fs-sm); color:#1a1a18; background:#fafaf9;
      font-family:inherit; outline:none;
    }
    .ideas-subtab-input input:focus { border-color:var(--accent); background:#fff; }
    .ideas-subtab-input button {
      padding:6px 12px; border:none; border-radius:7px;
      background:var(--accent); color:#fff; cursor:pointer;
      font-size:var(--fs-xs); font-weight:600; font-family:inherit;
    }
    .ideas-subtab-input button:disabled { opacity:.4; cursor:not-allowed; }
    .ideas-subtab-input .cancel-btn {
      background:#fff; color:#4a4a48; border:1px solid #e0e0de;
    }

    /* SETTINGS TAB */
    .settings-tab { padding:18px 16px; display:flex; flex-direction:column; gap:10px; }
    .settings-section-title {
      font-size:var(--fs-xs); font-weight:600; color:#a0a09c;
      text-transform:uppercase; letter-spacing:.6px;
      padding:0 2px; margin-bottom:2px;
    }
    .settings-card { background:#fff; border:1px solid #ebebea; border-radius:12px; overflow:hidden; }
    .settings-row {
      padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid #f0f0ee;
    }
    .settings-row:last-child { border-bottom:none; }
    .settings-row-label { font-size:var(--fs-base); font-weight:500; color:#1a1a18; }
    .settings-row-sub   { font-size:var(--fs-xs); color:#a0a09c; margin-top:1px; }

    /* Color swatches */
    .color-swatches { display:flex; gap:10px; }
    .color-swatch {
      width:28px; height:28px; border-radius:50%; cursor:pointer;
      border:2px solid transparent; transition:all .15s; position:relative;
    }
    .color-swatch.sel { border-color:#1a1a18; transform:scale(1.12); }
    .color-swatch.sel::after {
      content:''; position:absolute; inset:3px;
      border-radius:50%; border:1.5px solid rgba(255,255,255,.8);
    }

    /* Font size selector */
    .font-size-opts { display:flex; gap:6px; }
    .font-size-opt {
      padding:5px 12px; border-radius:7px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-family:inherit; color:#4a4a48;
      font-weight:500; transition:all .12s;
    }
    .font-size-opt.sel { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* Toggle */
    .toggle {
      width:44px; height:26px; border-radius:13px; border:none; cursor:pointer;
      position:relative; transition:background .2s;
    }
    .toggle::after {
      content:''; position:absolute; top:3px; left:3px;
      width:20px; height:20px; border-radius:50%; background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .2s;
    }
    .toggle.on { background:var(--accent); }
    .toggle.on::after { left:21px; }
    .toggle.off { background:#d0d0cc; }
    .sound-type-opts { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
    .sound-type-btn {
      padding:5px 10px; border-radius:6px; border:1px solid #e0e0de;
      background:#fff; cursor:pointer; font-size:var(--fs-xs); font-weight:500;
      color:#4a4a48; transition:all .12s; font-family:inherit;
    }
    .sound-type-btn:hover { background:#f5f5f3; }
    .sound-type-btn.sel { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* Gemini API key field */
    .api-row { padding:14px 16px; }
    .api-input-row { display:flex; gap:6px; margin-top:8px; }
    .api-input-row input {
      flex:1; padding:8px 11px; border:1px solid #e0e0de; border-radius:7px;
      font-size:var(--fs-sm); color:#1a1a18; background:#fff;
      font-family:inherit; outline:none;
      letter-spacing:.5px;
    }
    .api-input-row input:focus { border-color:var(--accent); }
    .api-input-row button {
      padding:8px 14px; border:none; border-radius:7px;
      background:var(--accent); color:#fff; cursor:pointer;
      font-size:var(--fs-sm); font-weight:600; font-family:inherit;
    }
    .api-input-row button.secondary {
      background:#fff; color:#4a4a48; border:1px solid #e0e0de;
    }
    .api-status {
      margin-top:8px; font-size:10px; font-weight:600;
      letter-spacing:.3px;
    }
    .api-status.ok   { color:#2A8C5A; }
    .api-status.ng   { color:#c0392b; }
    .api-status.idle { color:#a0a09c; }

    /* Tag customization */
    .tag-row { padding:14px 16px; border-bottom:1px solid #f0f0ee; }
    .tag-row:last-child { border-bottom:none; }
    .tag-row .settings-row-label { margin-bottom:8px; }
    .tag-chip-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tag-chip {
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 4px 4px 10px; border-radius:6px;
      background:var(--accent-light); color:var(--accent);
      font-size:var(--fs-xs); font-weight:600;
    }
    .tag-chip-builtin {
      background:#f0f0ee; color:#6a6a68;
      padding:4px 10px;
    }
    .tag-chip button {
      width:18px; height:18px; border:none; border-radius:50%;
      background:transparent; color:var(--accent); cursor:pointer;
      font-size:14px; line-height:1; padding:0;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .tag-chip button:hover { background:rgba(0,0,0,.08); }
    .tag-add-row { display:flex; gap:6px; margin-top:10px; }
    .tag-add-row input {
      flex:1; padding:8px 11px; border:1px solid #e0e0de; border-radius:7px;
      font-size:var(--fs-sm); color:#1a1a18; background:#fff;
      font-family:inherit; outline:none;
    }
    .tag-add-row input:focus { border-color:var(--accent); }
    .tag-add-row button {
      padding:8px 14px; border:none; border-radius:7px;
      background:var(--accent); color:#fff; cursor:pointer;
      font-size:var(--fs-sm); font-weight:600; font-family:inherit;
    }
    .tag-add-row button:disabled { opacity:.4; cursor:not-allowed; }

    /* About */
    .about-card {
      background:#fff; border:1px solid #ebebea; border-radius:12px;
      padding:16px; text-align:center;
    }
    .about-app-name { font-size:17px; font-weight:700; letter-spacing:-.5px; color:#1a1a18; margin-bottom:3px; }
    .about-version  { font-size:var(--fs-xs); color:#a0a09c; }

    /* TODO check sparkle */
    .todo-item { position:relative; overflow:visible; }
    .todo-sparkle { position:absolute; left:20px; top:50%; width:0; height:0; pointer-events:none; z-index:20; }
    .todo-sparkle span {
      position:absolute; width:7px; height:7px; border-radius:50%; opacity:0;
      animation:todo-spark .65s ease-out forwards;
    }
    @keyframes todo-spark {
      0%   { opacity:1; transform:translate(0,0) scale(1.3); }
      60%  { opacity:.8; }
      100% { opacity:0; transform:translate(var(--dx), var(--dy)) scale(0); }
    }

    /* ── Dark mode ───────────────────────────────── */
    .app.dark { color:#f0f0ee; }
    .app.dark .app-header { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .app-header h1 { color:#f0f0ee; }
    .app.dark .tagline { color:#6a6a68; }
    .app.dark .coin-badge { background:rgba(255,255,255,.08); }
    .app.dark .bottom-nav { background:#1e1e21; }
    .app.dark .bottom-nav-wrapper { /* inherits from .bottom-nav */ }
    .app.dark .nav-tab .nav-label { color:#5a5a58; }
    .app.dark .nav-tab.active .nav-label { color:var(--accent); }
    .app.dark .tab-content { background:#141416; }
    .app.dark .memo-card { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .memo-card-label { color:#6a6a68; }
    .app.dark .memo-textarea { color:#f0f0ee; background:transparent; }
    .app.dark .memo-textarea::placeholder { color:#4a4a48; }
    .app.dark .memo-char-count { color:#4a4a48; }
    .app.dark .memo-actions { border-color:#2e2e32; }
    .app.dark .action-btn { background:#1e1e21; border-color:#2e2e32; color:#c0c0be; }
    .app.dark .img-preview { border-color:#2e2e32; }
    .app.dark .todo-controls { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .search-input { background:#28282c; color:#f0f0ee; border-color:#2e2e32; }
    .app.dark .filter-tag { background:#1e1e21; border-color:#2e2e32; color:#b0b0ac; }
    .app.dark .cal-wrapper { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .todo-list-header { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .cal-month-label { color:#f0f0ee; }
    .app.dark .cal-nav-btn { background:#1e1e21; border-color:#2e2e32; color:#b0b0ac; }
    .app.dark .cal-num { color:#f0f0ee; }
    .app.dark .cal-cell.today .cal-num { background:#f0f0ee; color:#1a1a18; }
    .app.dark .cal-cell.other-month .cal-num { color:#3a3a3e; }
    .app.dark .cal-cell:hover { background:#2e2e32; }
    .app.dark .cal-span-bar.single { background:rgba(255,255,255,.08); color:#b0b0ac; }
    .app.dark .mode-btn { background:#1e1e21; border-color:#2e2e32; color:#b0b0ac; }
    .app.dark .cal-toggle { background:#1e1e21; border-color:#2e2e32; color:#b0b0ac; }
    .app.dark .todo-item { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .todo-title { color:#f0f0ee; }
    .app.dark .todo-del { background:#1e1e21; border-color:#2e2e32; color:#4a4a48; }
    .app.dark .todo-coin-reward { color:#ffd54f; background:rgba(255,213,79,.12); }
    .app.dark .item-copy-btn { background:#1e1e21; border-color:#2e2e32; color:#5a5a58; }
    .app.dark .todo-add-row { border-color:#2e2e32; background:transparent; }
    .app.dark .trash-open-btn { border-color:#2e2e32; color:#5a5a58; }
    .app.dark .trash-item { border-color:#2e2e32; }
    .app.dark .trash-item:hover { background:#28282c; }
    .app.dark .trash-item-title { color:#f0f0ee; }
    .app.dark .trash-restore-btn { background:#1e1e21; border-color:#2e2e32; }
    .app.dark .attachment-thumb { border-color:#2e2e32; }
    .app.dark .attachment-file-chip { background:#1a2030; border-color:#2a3a50; }
    .app.dark .attachment-file-label { color:#7ab0ff; }
    .app.dark .attachment-add-btn { border-color:#3e3e42; background:#1e1e21; }
    .app.dark .attachment-add-label { color:#5a5a58; }
    .app.dark .attachment-link-chip { background:#1a2e1a; border-color:#2a4a2a; }
    .app.dark .attachment-row-link { background:#1a2e1a; border-color:#2a4a2a; color:#66bb6a; }

    /* Boss TODO */
    .boss-item {
      background:linear-gradient(135deg, #fffde7 0%, #fff8e1 100%);
      border:2px solid #ffd700; border-radius:12px;
      padding:12px 14px; margin-bottom:10px;
      display:flex; align-items:center; gap:10px;
      animation:boss-pulse 2.5s ease-in-out infinite;
    }
    @keyframes boss-pulse {
      0%, 100% { box-shadow:0 0 0 0 rgba(255,215,0,.5); }
      50%       { box-shadow:0 0 0 10px rgba(255,215,0,0); }
    }
    .boss-crown { font-size:26px; flex-shrink:0; }
    .boss-body { flex:1; min-width:0; }
    .boss-title { font-size:13px; font-weight:700; color:#7a5200; line-height:1.45; }
    .boss-reward { font-size:11px; color:#c8860a; margin-top:3px; font-weight:600; }
    .boss-actions { display:flex; flex-direction:column; gap:4px; align-items:flex-end; flex-shrink:0; }
    .boss-complete-btn {
      background:linear-gradient(135deg, #ffd700, #ff9500); color:#4a2800;
      border:none; border-radius:8px; padding:7px 12px;
      font-size:12px; font-weight:800; cursor:pointer; font-family:inherit;
      box-shadow:0 2px 8px rgba(255,200,0,.4); white-space:nowrap;
      transition:transform .12s, box-shadow .12s;
    }
    .boss-complete-btn:active { transform:scale(.95); }
    .boss-dismiss-btn {
      width:20px; height:20px; border:1px solid #e8d066; background:transparent;
      border-radius:50%; cursor:pointer; font-size:9px; color:#b09030;
      display:flex; align-items:center; justify-content:center; transition:background .12s;
    }
    .boss-dismiss-btn:hover { background:rgba(255,215,0,.2); }
    .app.dark .boss-item { background:linear-gradient(135deg, #2a2000 0%, #1e1800 100%); border-color:#6b5500; }
    .app.dark .boss-title { color:#ffd700; }
    .app.dark .boss-reward { color:#c8a000; }
    .app.dark .boss-dismiss-btn { border-color:#4a3800; color:#8a6a00; }

    /* Sparkle burst overlay (memo→items reflection) */
    .sparkle-burst {
      position:absolute; pointer-events:none; z-index:250;
      width:0; height:0; left:50%; top:50%;
    }
    .sparkle-burst span {
      position:absolute; left:0; top:0;
      width:6px; height:6px; border-radius:50%;
      background:var(--accent); opacity:0;
      animation: spark-fly .9s ease-out forwards;
    }
    @keyframes spark-fly {
      0%   { opacity:1; transform:translate(0,0) scale(.6); }
      80%  { opacity:1; }
      100% { opacity:0; transform:translate(var(--dx), var(--dy)) scale(1.1); }
    }

    /* MemoMon animations */
    @keyframes monBob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-4px); }
    }
    @keyframes monHappy {
      0%   { transform: scale(1) rotate(-8deg); }
      100% { transform: scale(1.12) rotate(8deg); }
    }
    @keyframes monMsgFloat {
      0%   { opacity:1; transform:translateX(-50%) translateY(0); }
      100% { opacity:0; transform:translateX(-50%) translateY(-22px); }
    }

<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update().catch(() => {});
      }).catch(() => {});
    });
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
</script>
